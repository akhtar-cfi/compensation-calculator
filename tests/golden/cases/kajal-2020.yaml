id: kajal-2020
title: "Kajal v Jagdish Chand & Ors."
citation: "(2020) 4 SCC 413"   # 2020 INSC 135; Civil Appeal No. 735 of 2020 (@ SLP(C) No. 15504 of 2019)
court: SC
judgment_date: 2020-02-05
source_url: "https://api.sci.gov.in/supremecourt/2019/19924/19924_2019_11_1502_20257_Judgement_05-Feb-2020.pdf"
kind: injury
facts:
  accident_date: 2007-10-18
  age_at_accident: 12
  state: Haryana                 # treated at Karnal / PGI Chandigarh; Haryana 2010 minimum-wage notification used
  occupation: student            # school-going child
  employment: minor
  claimants: null
  disability: {certificate_pct: 100, functional_pct: null}   # PGI Board certificate Ex.P6: 100%; brain injury, IQ < 20%
judgment_params:
  monthly_income: 4846           # minimum wage of a skilled workman (Haryana notification, 2010)
  future_prospects_pct: 40
  personal_deduction: null
  multiplier: 18
  disability_pct_applied: 100    # implicit: loss of future earnings taken in full; no % factor shown
  attendant: {attendants: 2, monthly_per_attendant: 5000, multiplier: 18}
  hospital_attendants: {attendants: 2, per_day: 500, days: 51}
  conventional: null
  interest_pct: 7.5
expected:
  heads:
    medical_hospitalisation_transportation: 250000   # = medical 2,00,000 + transportation 50,000 (para 19)
    loss_of_earnings_family_members: 51000           # 2 attendants x Rs.500/day x 51 days in hospital (para 21)
    loss_of_earning_capacity: 1466000                # "Loss of future earnings"
    attendant: 2160000
    pain_suffering_and_loss_of_amenities: 1500000
