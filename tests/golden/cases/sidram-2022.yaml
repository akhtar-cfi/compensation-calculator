notes: >-
  Arithmetic verified: heads sum to 21,78,600 (matches). IMPORTANT for calculators: the SC did
  NOT add future prospects to the notional income of a 19-year-old self-employed claimant
  (8,000 x 12 x 18 x 45%); a Pranay-Sethi-style 40% FP would give 10,88,640 instead of 7,77,600.
  The Court used the 45% certified whole-body disability as the loss-of-earning-capacity % even
  while describing paraplegia as causing '100% loss of earning capacity' (para 56). Future
  medical and attendant charges are both monthly x 12 x 18. Litigation expenses is a head
  outside the usual list. Minor inconsistency in the judgment: para 61 says the Tribunal awarded
  Rs.40,000 for loss of earning for 6 months, but the Tribunal table (para 5) shows Rs.4,000
  and only 4,000 makes the MACT total 6,13,000 add up. Lower-forum tables both sum correctly
  (MACT 6,13,000; HC 9,26,800). Neutral citation not printed on the SCI PDF (2022 INSC 1204 from
  secondary sources). Wording verbatim; layout normalised.
