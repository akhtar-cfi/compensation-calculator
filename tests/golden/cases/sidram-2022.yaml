computation_quote: |
  [para 60] In the overall view of the matter, we are convinced that we should determine the
  notional income of the appellant herein at Rs. 8,000/- per month. The same would result in
  the compensation being enhanced as under:
             8000 x 12 x 18 x 45% = INR 7,77,600/-
  [para 62] We uphold the payment towards loss of earning for six months as awarded by the
  High Court and applying the revised income, enhance the same as under:
             8000 x 6 = INR 48,000/-
  [para 66] In view of the aforesaid, we grant compensation of Rs. 1,55,000/- towards medical
  expenses.
  [para 69] ... considering that the appellant at the time of accident was 19 years old, today
  his age would be around 29 years, even if a bare minimum of Rs. 1000/- is spent per month,
  then it comes to:
                      1000 x 12 x 18 = Rs. 2,16,000/-
  [para 73] ... According to the claimant, the cost of keeping the attendant would be
  Rs. 4,500/- per month. We fix it at Rs. 2,000/- per month. As a result, we award the
  attendant charges as under:
           2,000 x 12 x 18 = Rs. 4,32,000/-
  [para 82] In view of the aforesaid, we award an amount of Rs. 50,000/- towards litigation
  expenses.
  [para 90] In view of the aforesaid, we may award Rs. 50,000/- towards loss of conveyance and
  special diet.
  [para 98] In view of the aforesaid, we award an amount of Rs. 1,00,000/- towards pain and
  suffering.
  [para 103] In view of the aforesaid, we award a sum of Rs. 3,00,000/- towards loss of
  marriage prospects.
  [para 111] In view of the aforesaid, we award an amount of Rs. 50,000/- for the loss of
  amenities taking into consideration the fact that the appellant was 19 years old at the time
  of the accident, and also considering the nature of injuries suffered by him and the extent
  of his disability.
  [para 112] The total compensation awarded by us under different heads is as under:
  S.NO. | COMPENSATION                     | AMOUNT (IN RUPEES)
  1     | Loss of earning due to disability | 7,77,600/-
  2.    | Loss of earning for 6 months      | 48,000/-
  3.    | Medical expenses                  | 1,55,000/-
  4.    | Future medical expenses           | 2,16,000/-
  5.    | Attendant Charges                 | 4,32,000/-
  6.    | Litigation charges                | 50,000/-
  7.    | Loss of conveyance                | 50,000/-
  8.    | Pain and suffering                | 1,00,000/-
  9.    | Marriage prospects                | 3,00,000/-
  10    | Loss of amenities                 | 50,000/-
        | TOTAL                             | 21,78,600/-
  [para 114] ... The rate of interest at the enhanced amount is to be the same i.e., 6% per
  annum.
