notes: >-
  Arithmetic verified: 12,000 x 1.4 x 1/2 x 12 x 18 = 18,14,400; total 19,25,070 (matches).
  Multiplier 18 by the deceased's age 22 (Sarla Verma 21-25), not the mother's age (the Tribunal
  had used 11). CONVENTIONAL HEADS are Pranay Sethi base figures WITHOUT the 10%/3-year
  escalation (estate 15,000; consortium 40,000) even though decided in 2026, and funeral is
  30,000 (double the Pranay Sethi 15,000) because of body transport from Agra - a calculator
  that applies standard conventional amounts will not reproduce this. Includes a property-damage
  head (motorcycle 25,670) outside the usual death heads. Lower forums: MACT heads in para 10
  (1,98,000 + 18,000 + 2,500 + 5,000) sum to 2,23,500, but the judgment states the MACT total as
  2,23,000 (both in para 2 and the para 10 table) - Rs.500 discrepancy in the judgment. HC total
  13,44,000 = 6,000 x 12 x 18 (12,96,000, no FP, no deduction) + 30,000 conventional + 18,000
  motorcycle. Source is Verdictum's copy of the signed SC judgment (official SCI PDF URL not
  located). Wording verbatim; layout normalised.
