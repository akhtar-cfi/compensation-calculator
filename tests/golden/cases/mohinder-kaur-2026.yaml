computation_quote: |
  [para 26] ... Having regard to the aforesaid, we deem it appropriate to assess the monthly
  income of the deceased at ₹12,000/-, considering that the death occurred in the year 2000.
  [para 27] The High Court erroneously denied future prospects and deduction towards personal
  and living expenses solely on grounds that the income of the deceased in the instant case was
  notional. This approach is contrary to the well-settled principles enunciated in Sarla Verma
  (supra), and affirmed in Pranay Sethi (supra). Resultantly, 40% future prospects ought to be
  added to the notional monthly income of ₹12,000/-, as the deceased fell within the bracket of
  less than 40 years of age as per the law in Pranay Sethi (supra). This would render an amount
  of ₹16,800/-, and one-half of the said amount ought to be deducted towards personal and living
  expenses, since the deceased was a bachelor, which brings the monthly dependency to ₹8,400/-
  and the annual dependency to ₹1,00,800/- (₹8,400 x 12). When a multiplier of 18, as rightly
  adopted by the High Court, is applied to the said multiplicand, the annual loss of dependency
  is computed at ₹18,14,400/- (₹1,00,800 x 18).
  [para 29] Accordingly, we award a sum of ₹15,000/- towards loss of estate. Further, a sum of
  ₹40,000/- is deemed just and reasonable under the head of filial consortium, particularly in
  view of the law laid down in Magma General Insurance (supra). In our considered view, the
  Appellant-Claimant is also entitled to an amount of ₹30,000/- under the head of funeral
  expenses, especially when we take stock of the fact that expenses were also incurred in
  transporting the dead body from Agra to the deceased's hometown in Hoshiarpur, Punjab.
  [para 30] Insofar as the compensation towards damage to the motorcycle is concerned, we are of
  the opinion that the loss ought to be ascertained at ₹25,670/- in terms of the surveyor's
  report, ...
  [para 31] In light of the above discussion, the Appellant-Claimant is entitled to compensation
  as follows:
  Heads               | Compensation Awarded
  Loss of Dependency  | ₹18,14,400/- (₹8,400 x 12 x 18)
  Loss to the Estate  | ₹15,000/-
  Filial Consortium   | ₹40,000/-
  Funeral Expenses    | ₹30,000/-
  Motorcycle Damage   | ₹25,670/-
  TOTAL               | ₹19,25,070/-
  [para 33] Thus, on the total compensation amount, the Appellant-Claimant shall be entitled to
  interest @7.5% per annum from the date of filing of the petition till the realization of the
  enhanced compensation. ...
