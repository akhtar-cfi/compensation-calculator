computation_quote: |
  [para 10] Adverting to the facts at hand, the appellant was an 8-year-old child at the time
  of the accident. In view of the above exposition of law, we must advert to the prevailing
  minimum wages, which for the skilled ones, as in the year of accident, i.e., 2012, in Gujarat
  would be Rs.227.85p. per day, therefore, in the interest of justice, we deem it appropriate
  to determine the income of the appellant as Rs.6,835.5p. per month, rounding off to
  Rs.6,836/- per month.
  [para 11] ... we are in agreement with the finding of the High Court that the permanent
  functional disability stands rightly fixed at 90%.
  [para 13] In view of the aforesaid, the compensation now payable to the claimant-appellant
  would be recalculated as under:
  CALCULATION OF COMPENSATION
  Compensation Heads          | Amount Awarded
  Monthly Income              | Rs.6,836/-
  Yearly Income               | Rs.82,032/-
  Future Prospects (40%)      | 82,032 + 32,813 = Rs.1,14,845/-
  Multiplier (18)             | Rs.1,14,845/- X 18 = Rs.20,67,210/-
  Permanent Disability (90%)  | 90% of Rs.20,67,210/- = Rs.18,60,489/-
  Loss of Income/Future Earnings due to Disability | Rs.18,60,489/-
  Medical Expenses            | Rs.30,000/-
  Future Medical Expenses     | Rs.50,000/-
  Special diet and Transportation | Rs.1,00,000/-
  Loss of Marriage Prospects  | Rs.3,00,000/-
  Loss of Income during treatment | Rs.50,000/-
  Pain and Suffering          | Rs.5,00,000/-
  Loss of Amenities           | Rs.2,00,000/-
  Cost of Artificial Limb     | Rs.5,00,000/-
  TOTAL                       | Rs.35,90,489/-
  Thus, the difference in compensation is as under :
  MACT Rs.3,90,000/- | High Court Rs.8,65,000/- | This Court Rs.35,90,489/-
  [para 17] ... Interest on the amount is to be paid, as awarded by the Tribunal, i.e., @ 9%
  per annum, from the date of filing of the claim petition.
paragraphs: ["4", "6", "9", "10", "11", "13", "15", "16", "17"]
notes: >-
  Arithmetic verified: heads sum to 35,90,489 (matches). ROUNDING: daily MW 227.85 x 30 =
  6,835.50 rounded to 6,836/month; FP 40% of 82,032 = 32,812.80 rounded to 32,813;
  1,14,845 x 18 x 90% = 18,60,489 exactly. A calculator using 6,835.50 unrounded would get ~18,60,350 (18,60,349.68).
  Multiplier 18 for an 8-year-old (below the Sarla Verma table's lowest band; the minor/child
  convention per Kajal). Monthly wage derived from a daily rate x 30 days. Holding: for a child,
  loss of income must be computed on the skilled-worker minimum wage of the State at the
  relevant time; insurers must place the applicable minimum-wage notification before the
  Tribunal where income is unproved. 'Loss of income during treatment' (50,000) awarded to a
  minor alongside the HC's 'loss of earnings of parents' head (which is not carried into the SC
  table). Minor inconsistency: para 14 dates the Tribunal order 17.10.2021, elsewhere
  17.09.2021. Wording verbatim; table layout normalised.
