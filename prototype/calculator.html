<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crashfree India — Compensation calculator (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Montserrat:wght@600;700;800&family=Noto+Sans+Devanagari:wght@700&display=swap">
<style>:root{--violet:#5D2DF7;--deep:#1B1340;--tint:#EFEAFE;--line:#D7CAFD;--band:#F6F7FF;--mar:#F5A524;--mtint:#FFF4DB;--mink:#8A5300;--ink:#020618;--muted:#475569;--subtle:#64748B;--hair:#E6E8F2;--teal:#0F766E;--ttint:#E6F6F4;--red:#B42318;--rtint:#FEF0EE;--sans:"Geist",system-ui,sans-serif;--head:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/22px var(--sans);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--head);letter-spacing:-.4px}
.h1{font:700 26px/32px var(--head);letter-spacing:-.5px;text-wrap:balance}
.eyebrow{font:600 12px/16px var(--sans);letter-spacing:.9px;text-transform:uppercase;color:var(--violet)}
.eyebrow.m{color:var(--subtle)}
.hint{font-size:15px;line-height:22px;color:var(--muted);text-wrap:pretty}
.small{font-size:13px;line-height:18px;color:var(--subtle)}
.link{display:inline-flex;align-items:center;gap:6px;font:600 15px var(--sans);color:var(--violet);white-space:nowrap}
.link.sm{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
svg{flex:none}
/* ---------- app shell ---------- */
#app{min-height:100dvh;display:flex;flex-direction:column}
.appbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
.appbar .back{display:inline-flex;align-items:center;gap:6px;font:600 15px var(--sans);padding:8px 8px 8px 0}
.langpill{border:1px solid var(--hair);border-radius:16px;padding:7px 12px;font:600 13px var(--sans);font-family:"Noto Sans Devanagari",var(--sans)}
.prog{height:4px;margin:0 20px;border-radius:2px;background:var(--tint);overflow:hidden}
.prog em{display:block;height:100%;background:var(--violet);border-radius:2px;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.pmeta{padding:10px 20px 0;font-size:13px;color:var(--subtle)}
.pmeta b{color:var(--violet);font-weight:600}
.body{padding:14px 20px 180px;display:flex;flex-direction:column;gap:14px;flex:1}
.body.res{padding-bottom:110px}
.nav,.dkfoot,.rail,.dkmeta{display:none}
/* ---------- controls ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--hair);background:#fff;width:100%;min-height:60px;transition:border-color .15s,background .15s}
.opt .gl{width:44px;height:44px;border-radius:12px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--violet);flex:none}
.opt .tx{display:flex;flex-direction:column;gap:2px;flex:1}
.opt .tx b{font:600 16px/22px var(--sans)}
.opt .tx span{font-size:13px;line-height:18px;color:var(--muted)}
.opt .ra{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--hair);flex:none;display:flex;align-items:center;justify-content:center}
.opt.on{border-color:var(--violet);background:var(--tint)}
.opt.on .gl{background:#fff}
.opt.on .ra{background:var(--violet);border-color:var(--violet)}
.opt:active{transform:scale(.99)}
.ns{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;border:1.5px dashed var(--line);color:var(--muted);font:500 15px var(--sans);width:100%}
.ns .ra{width:20px;height:20px;border-radius:10px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.ns.on{border-style:solid;border-color:var(--violet);background:var(--tint);color:var(--ink)}
.ns.on .ra{background:var(--violet);border-color:var(--violet)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:99px;border:1.5px solid var(--hair);font:600 14px var(--sans);background:#fff;white-space:nowrap}
.chip.on{border-color:var(--violet);background:var(--tint);color:var(--violet)}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font:600 15px var(--sans)}
.field .fh{font-size:13px;line-height:18px;color:var(--muted)}
.inp{display:flex;align-items:center;gap:8px;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid var(--hair);background:#fff;font:600 20px var(--sans)}
.inp:focus-within{border-color:var(--violet);box-shadow:0 0 0 3px var(--tint)}
.inp .pre{color:var(--subtle);font-weight:500}
.inp input{flex:1;min-width:0;border:0;outline:0;background:none;font:600 20px var(--sans);width:100%}
.inp input::placeholder{color:#B7BECC;font-weight:500}
.inp .suf{font:500 14px var(--sans);color:var(--subtle);white-space:nowrap}
.inp.err{border-color:var(--red)}
.echo{display:flex;align-items:center;gap:6px;font:600 13px var(--sans);color:var(--teal);min-height:18px}
.errt{font:500 13px var(--sans);color:var(--red)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-radius:16px;border:1.5px solid var(--hair)}
.counter .tx{display:flex;flex-direction:column;gap:2px}
.counter .tx b{font:600 16px var(--sans)}
.counter .tx span{font-size:13px;color:var(--muted)}
.counter .ctl{display:flex;align-items:center;gap:8px}
.counter .ctl button{width:40px;height:40px;border-radius:20px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--violet)}
.counter .ctl b{font:700 22px var(--head);min-width:28px;text-align:center}
.bigstep{display:flex;align-items:center;justify-content:space-between;max-width:300px}
.bigstep button{width:56px;height:56px;border-radius:28px;background:var(--tint);color:var(--violet);display:flex;align-items:center;justify-content:center}
.bigstep input{width:120px;text-align:center;border:0;outline:0;font:800 52px var(--head);letter-spacing:-2px;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 24px;border-radius:28px;background:var(--violet);color:#fff;font:600 17px var(--sans);box-shadow:0 10px 24px -10px rgba(93,45,247,.6);white-space:nowrap;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--tint);color:var(--violet);box-shadow:none}
.btn.ghost{background:#fff;color:var(--violet);border:1.5px solid var(--violet);box-shadow:none}
.btn.full{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.note2{display:flex;gap:10px;padding:14px 16px;border-radius:14px;background:var(--band);font-size:14px;line-height:20px;color:var(--muted)}
.note2 .tx{display:flex;flex-direction:column;gap:2px}.note2 b{color:var(--ink);font-weight:600}
.note2.warn{background:var(--mtint);color:var(--mink)}.note2.warn b{color:var(--mink)}
.note2.tint{background:var(--tint)}
.calm{display:flex;gap:10px;padding:14px 16px;border-radius:16px;background:var(--mtint);color:var(--mink);font-size:14px;line-height:20px}
.card{border-radius:20px;border:1px solid var(--hair);background:#fff;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.band{background:var(--band)}
.card.tint{background:var(--tint);border-color:var(--line)}
.pill{display:inline-flex;font:600 12px var(--sans);padding:5px 10px;border-radius:99px;background:var(--tint);color:var(--violet);white-space:nowrap}
.pill.teal{background:var(--ttint);color:var(--teal)}.pill.amber{background:var(--mtint);color:var(--mink)}.pill.red{background:var(--rtint);color:var(--red)}
.reveal{display:flex;flex-direction:column;gap:14px;padding-top:4px;border-top:1px solid var(--hair);margin-top:4px;padding-top:14px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chosen{display:flex;flex-direction:column;gap:6px}
.list{display:flex;flex-direction:column;border:1.5px solid var(--hair);border-radius:14px;overflow:hidden;max-height:260px;overflow-y:auto}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--hair);font:500 14px var(--sans);width:100%}
.li:last-child{border-bottom:0}
.li span{font-size:12px;color:var(--subtle)}
.li.on{background:var(--tint);color:var(--violet)}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--hair)}
.search input{flex:1;border:0;outline:0;font:500 15px var(--sans);background:none;min-width:0}
.yearrow{display:flex;align-items:center;justify-content:space-between;font:700 18px var(--head)}
.yearrow button{width:36px;height:36px;border-radius:18px;background:var(--tint);color:var(--violet);display:flex;align-items:center;justify-content:center}
.monthgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.monthgrid button{height:44px;border-radius:12px;border:1.5px solid var(--hair);font:600 14px var(--sans);text-align:center;display:flex;align-items:center;justify-content:center}
.monthgrid button.on{border-color:var(--violet);background:var(--tint);color:var(--violet)}
.monthgrid button[disabled]{opacity:.35}
.chk{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--hair);width:100%}
.chk i{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.chk.on i{background:var(--violet);border-color:var(--violet)}
.chk .tx{display:flex;flex-direction:column;gap:2px;font:600 15px var(--sans)}
.chk .tx span{font:400 13px/18px var(--sans);color:var(--muted)}
.helpcard{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;border:1px solid var(--hair)}
.helpcard .gl{width:48px;height:48px;border-radius:14px;background:var(--tint);display:flex;align-items:center;justify-content:center;color:var(--violet);flex:none}
.helpcard b{font:600 15px var(--sans)}.helpcard span{display:block;font-size:13px;line-height:18px;color:var(--muted)}
/* ---------- live estimate strip ---------- */
.live{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--hair);box-shadow:0 -10px 30px -16px rgba(27,19,64,.25);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:20}
.live .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.live .lbl{font:600 11px var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--subtle)}
.live .val{font:800 20px var(--head);letter-spacing:-.4px;white-space:nowrap;transition:all .3s}
.live.empty .val{color:var(--subtle);font:600 14px var(--sans)}
.live .bandbar{position:relative;height:8px;border-radius:4px;background:var(--tint)}
.live .bandbar u{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#B9A6FB,var(--violet));transition:left .5s cubic-bezier(.2,.7,.2,1),right .5s cubic-bezier(.2,.7,.2,1)}
.live .bandbar i{position:absolute;top:-3px;width:14px;height:14px;border-radius:7px;background:#fff;border:3px solid var(--violet);margin-left:-7px;transition:left .5s}
.live .sub{display:flex;justify-content:space-between;font-size:12px;color:var(--subtle)}
.live .sub b{color:var(--violet);font-weight:600}
.live .btnrow{display:flex;gap:10px}
.live .btnrow .btn{flex:1;height:52px}
.live .rule{font-size:11px;line-height:15px;color:var(--subtle)}
.live.flash .val{color:var(--violet)}
.lcard{display:none}
/* ---------- result ---------- */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .amt2{font:800 48px/52px var(--head);letter-spacing:-1.5px;display:flex;align-items:baseline;gap:8px}
.hero .amt2 small{font:700 20px var(--head);letter-spacing:-.3px;color:var(--muted)}
.rangebar{position:relative;height:40px;margin-top:6px}
.rangebar .tr{position:absolute;left:0;right:0;top:8px;height:10px;border-radius:5px;background:var(--tint)}
.rangebar .fl{position:absolute;top:8px;height:10px;border-radius:5px;background:linear-gradient(90deg,#B9A6FB,var(--violet))}
.rangebar .pin{position:absolute;top:0;width:26px;height:26px;margin-left:-13px;border-radius:13px;background:#fff;border:4px solid var(--violet);box-shadow:0 4px 10px rgba(93,45,247,.3)}
.rangebar .lab{position:absolute;top:28px;font-size:12px;color:var(--subtle);white-space:nowrap}
.readfirst{display:flex;flex-direction:column;border-radius:16px;background:var(--mtint);padding:4px 14px}
.readfirst .h{font:600 12px var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--mink);padding:10px 0 4px}
.readfirst .r{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid rgba(138,83,0,.15);width:100%}
.readfirst .r .t{display:flex;justify-content:space-between;gap:10px;font:600 14px/19px var(--sans);color:var(--mink)}
.readfirst .r .t span:last-child{font-weight:400;opacity:.7;font-size:12px;white-space:nowrap}
.readfirst .r .d{font-size:13px;line-height:18px;color:var(--mink);opacity:.85}
.tabs2{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--band)}
.tabs2 button{flex:1;text-align:center;padding:10px 4px;border-radius:10px;font:600 14px var(--sans);color:var(--muted);white-space:nowrap}
.tabs2 button.on{background:#fff;color:var(--violet);box-shadow:0 1px 3px rgba(2,6,24,.1)}
.hd4{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;padding:8px 0}
.hd4 b{font:500 14px var(--sans);color:var(--ink)}.hd4 em{font-style:normal;font:700 15px var(--head);text-align:right}
.hd4 i{grid-column:1/3;height:8px;border-radius:4px;background:var(--tint);position:relative;display:block;margin-top:4px}
.hd4 i u{position:absolute;inset:0 auto 0 0;background:var(--violet);border-radius:4px}
.hd4 span{grid-column:1/3;font-size:12px;line-height:16px;color:var(--subtle)}
.total{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--hair);font:700 15px var(--head)}
.total b{font:800 17px var(--head)}
.case3{border:1px solid var(--hair);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.case3 .who{display:flex;justify-content:space-between;align-items:center;gap:8px}
.case3 .who b{font:600 14px var(--sans)}
.case3 .line{font:600 14px/19px var(--head);color:var(--ink)}
.mult{display:inline-flex;align-items:center;font:700 13px/1 var(--head);color:var(--mink);background:var(--mtint);padding:5px 8px;border-radius:8px;white-space:nowrap}
.jr{display:grid;grid-template-columns:110px 1fr 86px;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.jr i{height:8px;border-radius:4px;background:var(--hair);position:relative;display:block}
.jr i u{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--violet)}
.jr i u.lo{background:var(--subtle)}
.jr b{font:700 14px var(--head);text-align:right;color:var(--ink)}
.ul{display:flex;flex-direction:column;gap:10px;list-style:none}
.ul li{display:flex;gap:10px;font-size:14px;line-height:20px}
.ul li svg{color:var(--violet);margin-top:2px}
.facts{display:flex;flex-direction:column}
.fact{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:14px}
.fact:last-child{border-bottom:0}.fact span{color:var(--subtle)}.fact b{font-weight:600;text-align:right}
.dock2{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--hair);display:flex;gap:10px;z-index:20}
.dock2 .btn{flex:1;height:52px;font-size:15px;padding:0 14px}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:0 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.step i{width:28px;height:28px;border-radius:14px;background:var(--ttint);display:flex;align-items:center;justify-content:center;color:var(--teal)}
.step i.v{background:var(--tint);color:var(--violet)}
.step .k{font-size:12px;color:var(--subtle)}.step .v{font:600 15px/20px var(--sans);color:var(--ink)}
.step button{font:600 13px var(--sans);color:var(--violet);padding:6px 0 6px 8px}
.step .tx{display:flex;flex-direction:column}
.twoamt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.twoamt .c{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--hair)}
.twoamt .c span{font-size:12px;color:var(--subtle)}.twoamt .c b{font:800 24px/28px var(--head);letter-spacing:-.6px}
.twoamt .c.bad{background:var(--rtint);border-color:transparent}.twoamt .c.bad b{color:var(--red)}
.twoamt .c.good{background:var(--tint);border-color:transparent}.twoamt .c.good b{color:var(--violet)}
.ratio{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--rtint);color:var(--red);font:600 15px/20px var(--sans)}
.ratio.ok{background:var(--ttint);color:var(--teal)}
.ratio b{font:800 26px var(--head);letter-spacing:-.5px}
.cmp{display:flex;flex-direction:column;gap:12px}
.cmp .r{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.cmp .r i{height:12px;border-radius:6px;background:var(--hair);position:relative;display:block}
.cmp .r i u{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--violet);transition:width .4s}
.cmp .r i u.lo{background:var(--red)}
.cmp .r b{font:700 15px var(--head);color:var(--ink);white-space:nowrap}
.sheetwrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheetwrap .overlay{position:absolute;inset:0;background:rgba(2,6,24,.45)}
.sheet{position:relative;width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;border-radius:24px 24px 0 0;background:#fff;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--hair);align-self:center}
.sheet h3{font:700 20px var(--head)}
.pre{white-space:pre-wrap;font:400 13px/19px var(--sans);background:var(--band);border-radius:14px;padding:14px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 16px;border-radius:12px;font:600 13px var(--sans);z-index:60;animation:fade .2s}
.sits .opt .gl{width:48px;height:48px}
.tag{font:600 12px var(--sans);color:var(--subtle)}
.bigq{font:700 30px/36px var(--head);letter-spacing:-.6px}
.summary-chips{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- desktop ---------- */
@media (min-width:1024px){
  body{background:#fff}
  .appbar,.prog,.pmeta,.live,.dock2{display:none}
  .nav{display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 144px;border-bottom:1px solid var(--hair)}
  .nav .logo svg{height:28px;width:auto;display:block}
  .nav .right{display:flex;align-items:center;gap:16px;font:500 14px var(--sans);color:var(--muted)}
  .dkprog{height:4px;background:var(--tint)}.dkprog em{display:block;height:100%;background:var(--violet);transition:width .4s}
  .dkgrid{display:grid;grid-template-columns:1fr 340px;gap:64px;padding:40px 144px 60px;align-items:start;flex:1}
  .dkmain{max-width:720px;display:flex;flex-direction:column;gap:18px}
  .dkmain .h1{font-size:44px;line-height:52px;letter-spacing:-1.2px}
  .dkmain .hint{font-size:17px;line-height:26px}
  .dkmeta{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--subtle)}
  .dkmeta b{color:var(--violet);font-weight:600}
  .dkmeta .back{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--sans);color:var(--subtle)}
  .rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
  .lcard{display:flex;flex-direction:column;gap:12px;border-radius:24px;border:1.5px solid var(--line);background:#fff;padding:22px;box-shadow:0 20px 40px -24px rgba(27,19,64,.25)}
  .lcard .lbl{font:600 11px var(--sans);letter-spacing:.8px;text-transform:uppercase;color:var(--subtle)}
  .lcard .val{font:800 28px/32px var(--head);letter-spacing:-.6px}
  .lcard .val.empty{font:600 18px var(--sans);color:var(--subtle)}
  .lcard .bandbar{position:relative;height:8px;border-radius:4px;background:var(--tint)}
  .lcard .bandbar u{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#B9A6FB,var(--violet));transition:left .5s,right .5s}
  .lcard .bandbar i{position:absolute;top:-3px;width:14px;height:14px;border-radius:7px;background:#fff;border:3px solid var(--violet);margin-left:-7px}
  .decides{display:flex;flex-direction:column}
  .dec{display:grid;grid-template-columns:18px auto 1fr;gap:10px;align-items:center;padding:8px 0;font-size:13px;color:var(--subtle);border-bottom:1px solid var(--hair)}
  .dec:last-child{border-bottom:0}
  .dec i{width:18px;height:18px;border-radius:9px;border:1.5px solid var(--hair);display:flex;align-items:center;justify-content:center}
  .dec.done i{background:var(--teal);border-color:var(--teal);color:#fff}
  .dec.now i{background:var(--violet);border-color:var(--violet);color:#fff}
  .dec.done span{color:var(--ink)}.dec.now span{color:var(--violet);font-weight:600}
  .dec span{white-space:nowrap}.dec em{font-style:normal;font-size:12px;text-align:right;color:var(--subtle);line-height:16px}
  .dec.done em{color:var(--ink)}.dec.done em button{color:var(--violet);font:600 12px var(--sans);margin-left:6px}
  .dec.now em{color:var(--violet)}
  .lcard .rule{font-size:11px;line-height:15px;color:var(--subtle)}
  .actions{display:flex;align-items:center;gap:20px;padding-top:6px}
  .dkfoot{display:flex;justify-content:space-between;padding:20px 144px;border-top:1px solid var(--hair);font-size:13px;color:var(--subtle)}
  .opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .body{padding:0}
  .dkcols{display:grid;grid-template-columns:600px 1fr;gap:40px;padding:36px 144px 40px;align-items:start;flex:1}
  .dkcols .col{gap:14px}
  .hero .amt2{font-size:64px;line-height:68px}
  .tabs2{max-width:640px}
  .dkactions{display:flex;gap:10px}
  .sheetwrap{align-items:center}
  .sheet{border-radius:24px;max-height:80vh}
}
@media print{.live,.dock2,.appbar,.nav,.dkfoot,.tabs2,.sheetwrap .overlay{display:none!important}.body{padding:0}}

/* --------------------------------------------------------------- income -- */
function incomeFor(f, run, asOf, pick) {
  const iso = f.accidentDate;
  const e = f.employment;
  const wage = (cat) => minWage(f.state, cat, iso, f.zone);

  if ((e === 'permanent' || e === 'fixed_salary') && f.proof === 'salary_slip' && f.monthlySalary) {
    const gross = Number(f.monthlySalary);
    const taxGiven = f.monthlyTax !== '' && f.monthlyTax != null;
    const tax = taxGiven ? Number(f.monthlyTax) * 12 : annualTax(gross * 12, iso, true);
    return { monthly: Math.max(0, gross - tax / 12), cls: e === 'permanent' ? 'permanent' : 'other', basis: 'salary', note: taxGiven ? null : 'TAX_ESTIMATED' };
  }
  if (e === 'self_employed' && f.proof === 'itr' && f.itrAnnualIncome) {
    const annual = Number(f.itrAnnualIncome);
    return { monthly: Math.max(0, (annual - annualTax(annual, iso, false)) / 12), cls: 'other', basis: 'itr', note: 'TAX_ESTIMATED' };
  }
  const mw = (cat) => { const w = wage(cat); return w ? { ...w } : null; };

  if (e === 'homemaker') {
    const dc = { monthly: escalate(30000, steps('2026-06-11', asOf, 3)), cls: 'other', basis: 'domestic_care' };
    const p = pick(f.kind === 'death' ? 'homemaker_income' : 'injured_homemaker_income');
    const useDC = f.kind === 'death' ? p !== 'C' : p === 'M';
    if (useDC) return dc;
    const w = mw('unskilled'); return w ? { monthly: w.v, cls: 'other', basis: 'mw_unskilled', wage: w } : { stop: 'mw_missing' };
  }
  if (e === 'minor') {
    if (f.kind === 'death' && pick('minor_death_income') === 'C') return { monthly: 25000 / 12, cls: 'none', basis: 'kurvan', kurvan: true };
    const w = mw('skilled'); return w ? { monthly: w.v, cls: 'other', basis: 'mw_skilled', wage: w } : { stop: 'mw_missing' };
  }
  if (e === 'student') {
    const w = mw('skilled'); if (!w) return { stop: 'mw_missing' };
    if (f.studentCourse === 'professional') {
      const low = pick('student_income') === 'C';
      return { monthly: low ? Math.min(w.v, 12000) : Math.max(w.v, 12000), cls: 'other', basis: 'mw_skilled', wage: w };
    }
    return { monthly: w.v, cls: 'other', basis: 'mw_skilled', wage: w };
  }

    const pension = Number(f.pensionMonthly || 0);
    if (pension > 0) {
      const fam = Number(f.familyPensionMonthly || 0);
      return { monthly: pick('pension_basis') === 'C' ? Math.max(0, pension - fam) : pension, cls: 'none', basis: 'pension' };

/* ------------------------------------------------------------ deduction -- */
const depCount = (f) => {
  const spouse = f.married === 'yes' && f.spouse === 'yes' ? 1 : 0;

const claimantCount = (f) => (f.married === 'yes' && f.spouse === 'yes' ? 1 : 0) + Number(f.children || 0) + Number(f.parents || 0);
function deduction(f, pick) {

    if (n >= 7) return 1 / 5; if (n >= 4) return 1 / 4; if (n >= 2) return 1 / 3;
    if (n === 1) return pick('spouse_only_deduction') === 'C' ? 1 / 2 : 1 / 3;
    return 1 / 2;
  }

/* -------------------------------------------------------- functional % -- */
function functionalPct(f, pick) {
  if (f.functionalPct !== '' && f.functionalPct != null) return Math.min(100, Number(f.functionalPct));
  const p = pick('functional_pct');

  if (f.noCertificate) return p === 'M' && cannot ? 100 : 0;

/* ----------------------------------------------------------- one run ----- */
function runOnce(f, run, asOf, mix) {

  if (inc.stop) return { stop: inc.stop };
  if (inc.note) warn.push(inc.note);
  if (inc.wage && inc.wage.contested) warn.push('MW_CONTESTED');
  if (inc.wage && inc.wage.zoneAssumed) warn.push('ZONE_ASSUMED');

  const mult = inc.kurvan ? 15 : multiplier(age, pick('under_15_multiplier'));
  if (age > 70) warn.push('AGE_OUTSIDE_TABLE');
  const pros = inc.kurvan ? 0 : prospects(age, inc.cls);
  const monthly = inc.monthly;

  if (f.kind === 'death') {
    const ded = inc.kurvan ? 0 : deduction(f, pick);

    const clock = steps('2017-10-31', asOf, 3);

  }

  const months = Number(f.monthsOffWork || 0);
  if (months > 0) heads.push({ k: 'lost', v: Math.round(monthly * months) });
  const bills = Number(f.medicalBills || 0), cash = Number(f.cashlessPaid || 0);

  heads.push({ k: 'attendant', v: BAND_ATTENDANT[band] }, { k: 'conveyance', v: BAND_CONVEYANCE[band] }, { k: 'pain', v: painBand(fp, band) });

  if (f.permanentAttendant) {
    const w = minWage(f.state, pick('attendant_rate') === 'M' ? 'semi_skilled' : 'unskilled', f.accidentDate, f.zone);
    if (w) heads.push({ k: 'futureAttendant', v: Math.round(w.v * 12 * mult) });
  }

/* ------------------------------------------------------------- stops ----- */
function stopsOf(f) {
  const out = [];
  if (f.victimRole === 'owner_driver_single_vehicle') out.push('owner_driver');
  if (f.vehicleTraced === 'no') out.push('unidentified');
  if (f.s164 === 'accepted_via_insurer') out.push('s164_insurer');
  return out;
}

/* --------------------------------------------------------------- main ---- */
function estimate(f, asOf, opts) {
  const mix = opts && opts.mix;
  const stops = stopsOf(f);
  if (stops.length) return { stop: stops[0] };
  const runs = {}, warn = new Set();
  for (const r of ['C', 'L', 'M']) {
    const out = runOnce(f, r, asOf, mix);
    if (out.stop) return { stop: out.stop, state: f.state };
    runs[r] = { ...out, total: out.heads.reduce((s, h) => s + h.v, 0) };
    out.warn.forEach((w) => warn.add(w));
  }
  const C = runs.C.total, L = runs.L.total, M = runs.M.total;
  const low = Math.min(C, L), high = Math.max(M, L);
  const spreadOk = low > 0 && high / low <= (f.kind === 'death' ? 1.75 : 2.5);
  const barOk = spreadOk && (M - C) / L >= 0.05;
  if (!spreadOk) warn.add('RANGE_TOO_WIDE');
  if (f.vehicleTraced === 'yes' && f.vehicleInsured === 'no') warn.add('UNINSURED');
  if (f.vehicleTraced === 'unknown') warn.add('ASSUMED_TRACED');
  if (f.s164 === 'unknown') warn.add('ASSUMED_NO_S164');
  if (f.victimRole === 'driver_of_involved_vehicle') warn.add('CONTRIBUTORY_NEGLIGENCE');
  // Limitation: six whole months since the accident and no claim on record.
  if (!f.claimFiledDate && f.accidentDate && wholeMonths(f.accidentDate.length === 7 ? f.accidentDate + '-01' : f.accidentDate, asOf) >= 6) warn.add('LIMITATION');

  const out = { runs, C, L, M, low, high, barOk, headline: L, warn: [...warn], asOf, versions: VERSIONS };
  if (!mix) {
    out.movers = movers(f, asOf, L);
    out.whatIf = whatIfs(f, asOf, L);
  }
  return out;
}

/* Each contested point moved alone to C and to M; the change in the standard figure, largest first. */
function movers(f, asOf, base) {
  const out = [];
  for (const id of POINTS) {
    const toC = estimate(f, asOf, { mix: { [id]: 'C' } });
    const toM = estimate(f, asOf, { mix: { [id]: 'M' } });
    const dC = toC.stop ? 0 : toC.L - base, dM = toM.stop ? 0 : toM.L - base;
    if (dC !== 0 || dM !== 0) out.push({ id, toC: dC, toM: dM, basis: typeof POINT_BASIS[id] === 'string' ? POINT_BASIS[id] : POINT_BASIS[id][f.kind], sources: POINT_SOURCES[id] });
  }
  out.sort((a, b) => (Math.abs(b.toC) + Math.abs(b.toM)) - (Math.abs(a.toC) + Math.abs(a.toM)));
  return out;
}

/* "What if" cards: facts not in the three figures, each shown as its own figure. */
function whatIfs(f, asOf, base) {
  const out = [];
  if (f.victimRole === 'driver_of_involved_vehicle') {
    out.push({ id: 'neg25', v: Math.round(base * 0.75), delta: -Math.round(base * 0.25) });

    const r = E.offerCheck(est.L, est.C, o, S.offerOpts); const pct = Math.round(r.pct);
    const V = { far_below: 'Far below the estimate', well_below: 'Well below the estimate', below: 'Below the estimate', near: 'Near the estimate', close: 'Close to the estimate', above: 'Above the estimate' }[r.verdict];
    const ok = ['near', 'close', 'above'].includes(r.verdict);
    const mx = Math.max(o, est.L, r.withInterest);
    body += `<div class="twoamt"><div class="c bad"><span>The offer</span><b>${words(o)}</b></div><div class="c good"><span>Your estimate</span><b>${words(est.L)}</b></div></div>
      <div class="ratio${ok ? ' ok' : ''}"><b>${pct}%</b><span>of the estimate. ${V.replace('the estimate', 'it')}.</span></div>
      <div class="cmp"><div class="r"><span>The offer</span><i><u class="lo" style="width:${(o / mx) * 100}%"></u></i><b>${words(o)}</b></div><div class="r"><span>Your estimate</span><i><u style="width:${(est.L / mx) * 100}%"></u></i><b>${words(est.L)}</b></div><div class="r"><span>With interest, ${S.offerOpts.years} years</span><i><u style="width:${(r.withInterest / mx) * 100}%"></u></i><b>${words(r.withInterest)}</b></div></div>
      <div class="between"><span class="small">${S.offerOpts.years} years to award · ${S.offerOpts.rate}% interest · no fee</span><button class="link sm" data-act="assume">Change</button></div>
      ${S.assume ? `<div class="reveal"><div class="field"><label>Years until the award</label><div class="seg">${[3, 6, 9].map((y) => `<button class="chip${S.offerOpts.years === y ? ' on' : ''}" data-act="years" data-v="${y}">${y}</button>`).join('')}</div></div><div class="field"><label>Interest rate</label><div class="seg">${[6, 7.5, 9].map((y) => `<button class="chip${S.offerOpts.rate === y ? ' on' : ''}" data-act="rate" data-v="${y}">${y}%</button>`).join('')}</div></div></div>` : ''}
      ${note2('Signing usually ends the claim', 'A full-and-final settlement closes it. Nothing more can be asked for later, even if the injury worsens.', true)}
      ${ok ? note2('Still take advice before signing', 'A higher figure can carry conditions. Free advice: your DLSA, or the NALSA helpline 15100.') : ''}`;
  }
  const cta = `<a class="btn" href="tel:15100" style="flex:1">Call 15100 for free help</a>`;
  return shell(`${pq('Is the offer fair?', 'Here is how it compares')}${body}<div class="actions dkonly">${cta}<button class="link" data-act="result">Back to the estimate</button></div>`, { meta: `Offer ${o ? inr(o) : '—'} · estimate ${inr(est.L)}`, cta: `<div class="dock2">${cta}</div>`, rail: true });
}
function shareText() {
  const c = compute(); const est = c.est; const x = f();
  return `Estimate from Crashfree India’s compensation calculator · 31 Oct 2026\nFacts: ${x.kind === 'death' ? 'death' : 'injury'}, ${x.age} · ${x.occupationCode ? OCC_LABEL(x.occupationCode) : empLabel(x.employment)} · ${stateName(x.state)} · accident ${monthName(x.accidentDate)}\nEstimate: ${inr(est.L)} (about ${words(est.L)}) · range ${words(est.low)}–${words(est.high)}\nNot legal advice. Free help: your DLSA, or NALSA 15100.\nRules ${E.VERSIONS.rules} · engine ${E.VERSIONS.engine} · not to be cited as authority.`;
}
function sheetHtml() {
  const c = compute(); const est = c.est;
  if (S.sheet === 'next') return `<div class="sheetwrap"><div class="overlay" data-act="closesheet"></div><div class="sheet"><span class="grab"></span><h3>What to do next</h3>${nextList()}<div class="eyebrow m" style="margin-top:4px">Interest is not in your number</div>${interestRows(est)}<a class="btn full" href="tel:15100">Call 15100 for free help</a></div></div>`;
  if (S.sheet === 'offerfirst') return `<div class="sheetwrap"><div class="overlay" data-act="closesheet"></div><div class="sheet"><span class="grab"></span><h3>What is the offer?</h3><p class="hint">Enter it now and it stays with you. A few questions follow, only the ones a figure needs, and the comparison appears with the number.</p><div class="inp"><span class="pre">₹</span><input inputmode="numeric" data-in="offer" value="${fmtIn(S.offer)}" placeholder="e.g. 8,00,000" autofocus></div><div class="echo">${echoLine(num(S.offer))}</div><button class="btn full" data-act="holdoffer"${num(S.offer) > 0 ? '' : ' disabled'}>Hold it and ask me the questions${I.arrow}</button></div></div>`;
  if (S.sheet === 'share') return `<div class="sheetwrap"><div class="overlay" data-act="closesheet"></div><div class="sheet"><span class="grab"></span><h3>Share or save</h3><div class="pre">${esc(shareText())}</div><div class="row"><button class="btn soft" style="flex:1;height:52px" data-act="copy">${I.copy}Copy text</button><button class="btn soft printbtn" style="flex:1;height:52px" data-act="print">${I.print}Save PDF</button></div><span class="small" style="text-align:center">Text, not a link: nothing leaves the device unless you send it.</span></div></div>`;
  return '';
}

/* ------------------------------------------------------------------ render & events */
function render() {
  let html = '';
  switch (S.screen) { case 'home': html = viewHome(); break; case 'q': html = viewQ(); break; case 'stop': html = viewStop(); break; case 'ready': html = viewReady(); break; case 'detail': html = viewDetail(); break; case 'check': html = viewCheck(); break; case 'result': html = viewResult(); break; case 'offer': html = viewOffer(); break; }
  if (html) { const app = $('#app'); app.innerHTML = html; const a = app.querySelector('[autofocus]'); if (a && window.innerWidth >= 1024) a.focus(); }
}
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function changeStep(step) {
  S.returnTo = S.screen === 'check' || S.screen === 'result' ? S.screen : null;
  const q = { kind: 'kind', checks: 'role', age: 'age', work: 'work', family: 'family', injury: 'injury', when: 'when', state: 'state' }[step];
  if (q === 'kind') { go('home'); return; } go('q', { q });
}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act],[data-set]'); if (!el) return;
  if (el.dataset.set) {
    const k = el.dataset.set; let v = el.dataset.val; if (k === 'permanentAttendant') v = v === 'true';
    set(k, v);
    if (k === 'employment') { set('proof', ''); set('occupationCode', ''); set('monthlySalary', ''); set('itrAnnualIncome', ''); S.occQ = ''; }
    if (k === 'married' && v === 'no') { set('spouse', ''); set('children', '0'); set('parents', '0'); set('dependentParents', ''); }
    if (k === 'married' && v === 'yes' && f().children === '0' && f().parents === '0' && !f().spouse) { set('children', ''); set('parents', ''); }
    if (k === 'parents') set('dependentParents', v === '0' ? '' : f().dependentParents);
    if (k === 'kind') {}
    if (k === 'permanentAttendant' && !S.detailsDone.includes('attendant')) S.detailsDone.push('attendant');
    const autoQ = ['victimRole', 'vehicleTraced', 's164'].includes(k) || (k === 'married' && f().kind === 'injury');
    if (autoQ && S.screen === 'q') { setTimeout(nextQuick, 160); render(); return; }
    render(); return;
  }
  const a = el.dataset.act;
  switch (a) {
    case 'back': back(); break;
    case 'hindi': toast('Hindi copy is with the legal reviewer. English for now.'); break;
    case 'sit': { const id = el.dataset.id; if (id === 'offer') { S.sheet = 'offerfirst'; render(); break; }
      if (!f().kind || (id === 'died' && f().kind !== 'death') || (id === 'hurt' && f().kind !== 'injury')) { S.f = { ...BLANK }; S.scaleMax = 0; S.detailsDone = []; }
      if (id === 'died') set('kind', 'death'); if (id === 'hurt') set('kind', 'injury'); if (id === 'homemaker') { set('kind', 'death'); set('employment', 'homemaker'); } if (id === 'untraced') { set('vehicleTraced', 'no'); set('kind', f().kind || 'death'); set('victimRole', 'not_driving'); go('stop'); break; }
      go('q', { q: 'role' }); break; }
    case 'resume': go('q', { q: quickList().find((q) => !answered(stepKey(q))) || 'state' }); break;
    case 'next': nextQuick(); break;
    case 'age': { const n = Math.max(0, Math.min(110, (num(f().age) || 0) + Number(el.dataset.d))); set('age', String(n)); render(); break; }
    case 'ageband': set('age', el.dataset.v); render(); break;
    case 'months': { const n = Math.max(0, Math.min(60, (num(f().monthsOffWork) || 0) + Number(el.dataset.d))); set('monthsOffWork', String(n)); render(); break; }
    case 'day': { const n = Math.max(1, Math.min(31, (num(f().accidentDay) || 0) + Number(el.dataset.d))); set('accidentDay', String(n)); render(); break; }
    case 'nocert': set('noCertificate', !f().noCertificate); if (f().noCertificate) { set('certificatePct', ''); set('certificateBasis', ''); } render(); break;
    case 'month': set('accidentDate', el.dataset.iso); render(); break;
    case 'year': S.year = Math.max(2011, Math.min(2026, S.year + Number(el.dataset.d))); render(); break;
    case 'change': changeStep(el.dataset.step); break;
    case 'foundlater': set('vehicleTraced', 'yes'); go('q', { q: 's164' }); break;
    case 'details': S.di = 0; go('detail', { di: 0 }); break;
    case 'details0': S.di = 0; go('detail', { di: 0 }); break;
    case 'dsave': { const d = detailList()[S.di]; if (!S.detailsDone.includes(d)) S.detailsDone.push(d); if (S.di + 1 >= detailList().length) go('check'); else go('detail', { di: S.di + 1 }); break; }
    case 'dskip': { if (S.di + 1 >= detailList().length) go('check'); else go('detail', { di: S.di + 1 }); break; }
    case 'result': S.tab = 0; go('result'); break;
    case 'tab': S.tab = Number(el.dataset.i); render(); break;
    case 'allheads': S.showAllHeads = !S.showAllHeads; render(); break;
    case 'caution': S.openCaution = S.openCaution === el.dataset.w ? null : el.dataset.w; render(); break;
    case 'morecautions': S.moreCautions = true; render(); break;
    case 'offer': go('offer'); break;
    case 'assume': S.assume = !S.assume; render(); break;
    case 'years': S.offerOpts.years = Number(el.dataset.v); render(); break;
    case 'rate': S.offerOpts.rate = Number(el.dataset.v); render(); break;
    case 'nextsheet': S.sheet = 'next'; render(); break;
    case 'share': S.sheet = 'share'; render(); break;
    case 'closesheet': S.sheet = null; render(); break;
    case 'holdoffer': S.sheet = null; save(); toast('Offer of ' + inr(num(S.offer)) + ' held'); render(); break;
    case 'copy': { const t = shareText(); if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast('Copied')); else toast('Select the text and copy'); break; }
    case 'print': window.print(); break;
  }
});
document.addEventListener('input', (ev) => {
  const el = ev.target.closest('[data-in]'); if (!el) return; const k = el.dataset.in; const v = el.value;
  if (k === 'occQ') { S.occQ = v; const list = el.closest('.field').querySelector('.list'); const q = v.toLowerCase(); const items = E.OCCUPATIONS.filter((o) => !q || o.en.toLowerCase().includes(q)).slice(0, 8);
    list.innerHTML = items.map((o) => `<button class="li${f().occupationCode === o.code ? ' on' : ''}" data-set="occupationCode" data-val="${o.code}">${o.en}<span>${o.cat.replace('_', '-')}</span></button>`).join('') + `<button class="li" data-set="occupationCode" data-val="" style="color:var(--violet)">Not in this list, or not sure</button>`; return; }
  if (k === 'offer') { S.offer = String(num(v)); save(); el.value = fmtIn(v); const e2 = el.closest('.inp').nextElementSibling; if (e2 && e2.classList.contains('echo')) e2.innerHTML = echoLine(num(v)); if (S.sheet === 'offerfirst') { const b = document.querySelector('[data-act="holdoffer"]'); if (b) b.disabled = !(num(v) > 0); } if (S.screen === 'offer') { render(); const n = document.querySelector('[data-in="offer"]'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } } return; }
  if (['monthlySalary', 'itrAnnualIncome', 'pensionMonthly', 'medicalBills', 'cashlessPaid', 'monthlyTax', 'familyPensionMonthly', 'claimedMonthly'].includes(k)) { set(k, String(num(v))); el.value = fmtIn(v); const echo = el.closest('.inp').nextElementSibling; if (echo && echo.classList.contains('echo')) echo.innerHTML = echoLine(num(v), el.parentElement.querySelector('.suf') ? ' ' + el.parentElement.querySelector('.suf').textContent : ''); refreshChrome(); return; }
  set(k, v); refreshChrome();
});
/* Re-render only the live strip, rail card and continue button while typing, so the input keeps focus. */
function refreshChrome() {
  const app = $('#app'); const live = app.querySelector('.live'); if (live) { const t = document.createElement('div'); t.innerHTML = liveStrip(live.querySelector('.btnrow') ? live.querySelector('.btnrow').innerHTML : ''); live.replaceWith(t.firstElementChild); }
  const lc = app.querySelector('.lcard'); if (lc) { const t = document.createElement('div'); t.innerHTML = lcard(''); lc.replaceWith(t.firstElementChild); }
  const ok = S.screen === 'q' ? (S.q === 'work' ? workDone() : S.q === 'injury' ? answered('injury') && (f().noCertificate || (Number(f().certificatePct) >= 1 && Number(f().certificatePct) <= 100)) : S.q === 'age' ? f().age !== '' : answered(stepKey(S.q))) : true;
  app.querySelectorAll('[data-act="next"]').forEach((b) => { b.disabled = !ok; });
  if (S.screen === 'q' && S.q === 'injury') { const basis = app.querySelector('[data-set="certificateBasis"]'); if (!basis && f().certificatePct !== '' && !f().noCertificate) render(); }
}
document.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && ev.target.matches('input') && S.screen === 'q') { const b = $('[data-act="next"]'); if (b && !b.disabled) nextQuick(); } if (ev.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
window.addEventListener('resize', () => { clearTimeout(window.__rt); window.__rt = setTimeout(render, 150); });
window.PROTO = { S, set, go, render, compute, reset: () => { localStorage.removeItem('cfi-proto3'); location.reload(); } };
render();
})();
</script></body></html>
