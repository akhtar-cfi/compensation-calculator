what_mattered:
- A medical board's disability assessment cannot be replaced by the tribunal's own view; if doubted, a fresh assessment
  should be ordered.
- Attendant charges, refused below, were awarded following Kajal.
- Pain and suffering was compensated separately from mental and physical agony.
summary: A man under 50 was left in a coma after an accident in Rajasthan in 2014. The tribunal and the High Court
  took his disability as 50% and awarded Rs 16.29 lakh and Rs 19.39 lakh. In 2025 the Supreme Court accepted the
  medical board's 100% and awarded Rs 48.7 lakh, about 11 years after the accident.
