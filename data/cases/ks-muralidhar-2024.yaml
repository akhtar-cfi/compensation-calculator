what_mattered:
- As a permanent employee under 40 he was entitled to 50% future prospects, not the 40% the High Court used.
- Pain and suffering was set at Rs 15 lakh for lifelong total disability.
- Money paid by his employer was not deducted from the compensation.
summary: A 37-year-old factory employee was left wheelchair-bound by a spinal injury in Karnataka in 2008. The tribunal
  awarded Rs 58.1 lakh and the High Court Rs 78.16 lakh. In 2024 the Supreme Court awarded Rs 1.02 crore, about
  16 years after the accident.
