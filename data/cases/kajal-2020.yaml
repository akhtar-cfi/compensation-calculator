summary: >-
  A 12-year-old girl was left 100% disabled in 2007. The tribunal awarded Rs 11.09 lakh and the High Court
  Rs 25.79 lakh. In 2020 the Supreme Court awarded Rs 62.27 lakh, mainly by using the skilled minimum wage for
  her lost earnings and paying for two attendants for life, more than 12 years after the accident.
