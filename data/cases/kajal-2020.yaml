what_mattered:
  - "A child's lost earnings were based on the state's skilled-worker minimum wage (Rs 4,846 a month), not a token Rs 15,000 a year."
  - "She was awarded two attendants for life: Rs 5,000 each a month x 12 x 18 = Rs 21.6 lakh."
