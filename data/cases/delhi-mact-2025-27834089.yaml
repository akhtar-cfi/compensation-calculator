what_mattered:
- Claimed Rs.30,000/month as auto driver but admitted no proof of income, so minimum wage of a skilled worker in
  Delhi (Rs.18,797) was used
- 12% permanent disability of right lower limb was cut to 5% functional whole-body disability because the disability
  did not stop him driving an auto
- '25% contributory negligence: claimant drove his auto into a parked truck despite clear visibility and room to
  pass'
- Only 2 of 5 medical bills were in his name (Rs.478 allowed); hospitalisation not documented, so only 3 months'
  loss of earnings
summary: A 47-year-old auto-rickshaw driver was injured in Delhi in 2021, and left with 5% functional disability.
  The insurer offered Rs 72,357, which was not accepted. The tribunal awarded Rs 3.11 lakh in 2025 after a 25% cut
  for the victim's own negligence, 4.8 years after the accident.
