what_mattered:
- 'Passengers in a horse cart cannot be blamed just because the cart was in the middle of the road: the 50% cut
  was set aside.'
- A homemaker's services have real money value; notional income was raised to Rs 5,000 a month.
- A homemaker gets 40% future prospects.
summary: A homemaker of about 30 died when the horse cart she was travelling in was hit in 2012, leaving her husband
  and three young children. The tribunal awarded Rs 3.55 lakh after a 50% cut for contributory negligence, and the
  High Court did not interfere. In 2020 the Supreme Court awarded Rs 11.96 lakh.
