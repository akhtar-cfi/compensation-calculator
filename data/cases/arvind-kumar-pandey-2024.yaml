what_mattered:
- With an uninsured vehicle the owners, not an insurer, must pay; the claim was first dismissed on that ground.
- A homemaker's income cannot be taken below the minimum wage of a daily wager; the Court took at least Rs 4,000
  a month.
- The Supreme Court fixed a lump sum instead of a head-wise calculation.
summary: A homemaker of about 50 died in Uttarakhand in 2006 while travelling in a car that turned out to be uninsured.
  The tribunal first dismissed the claim; after a remand it awarded Rs 2.5 lakh, and the High Court did not raise
  it. In 2024 the Supreme Court awarded Rs 6 lakh as a lump sum, more than 17 years after the accident.
