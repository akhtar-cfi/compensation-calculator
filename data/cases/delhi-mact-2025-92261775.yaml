what_mattered:
- Claimed Rs.30,000/month as a carpenter but admitted no proof of income, occupation or education, so Delhi unskilled
  minimum wage (Rs.16,792) used
- 15% permanent disability of the left upper limb assessed as 10% whole-body functional disability for manual work
- No medical bills, so nil medical expenses; only 2 months' loss of income allowed
- Insurer's legal offer was treated as deemed acceptance of negligence, so only quantum was tried
summary: A 41-year-old carpenter whose income was not proved was injured in Delhi in 2022, and left with 10% functional
  disability. The insurer offered Rs 3.89 lakh, which was not accepted. The tribunal awarded Rs 5.36 lakh in 2025,
  2.9 years after the accident.
