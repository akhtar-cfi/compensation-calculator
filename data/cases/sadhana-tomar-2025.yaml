what_mattered:
- Where income is not proved, the state's minimum-wage notification (Rs 6,500 a month for unskilled work in 2016)
  sets the floor, not a lower notional figure.
- A father and younger sister who were not financially independent counted as dependants, which reduced the personal
  deduction to 1/4.
- Consortium was paid to each of the five claimants.
summary: A 24-year-old in the wholesale fruit business died in Madhya Pradesh in 2016; his claimed income was not
  proved. The tribunal awarded Rs 9.77 lakh on a notional Rs 4,500 a month, and the High Court agreed. In 2025 the
  Supreme Court awarded Rs 17.53 lakh, about 8 years after the accident.
