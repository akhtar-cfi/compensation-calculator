what_mattered:
- Navy pay-directorate records (unrebutted) proved Rs.15,89,388 lost promotions during remaining service; the Rs.7.26
  crore 22-years-of-service claim was rejected as not following the multiplier method
- 88% disability (pelvis, right arm and leg) treated as 100% loss of earning capacity because a combat diver can
  never dive again and is restricted to a desk job with attendants
- Future loss computed on last drawn salary Rs.52,268 (excluding diving allowance and tax) + 50% future prospects,
  less indicative pension Rs.14,484, using multiplier 16 for age 35 when his service would end
- Lifetime attendant awarded by multiplier method on Andhra Pradesh unskilled minimum wage (Rs.9,155 x 12 x 16);
  no medical expenses claimed as treatment was in service hospitals
summary: A 23-year-old Navy marine commando was injured in 2018, and left with 100% functional disability. The tribunal
  awarded Rs 1.66 crore in 2026, 7.4 years after the accident.
