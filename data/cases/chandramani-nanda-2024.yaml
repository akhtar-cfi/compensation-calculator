what_mattered:
- A 60% certified neuro-cognitive disability meant 100% loss of earning capacity, since he could no longer work.
- Income was taken from a later salary certificate rather than an older tax return, and 40% future prospects were
  added.
- The award can exceed the amount claimed (Rs 30 lakh had been claimed).
summary: A 32-year-old branch manager suffered a severe head injury when a bus hit his car in Odisha in 2014. The
  tribunal awarded Rs 20.6 lakh; the High Court raised it to Rs 31 lakh by treating his 60% certified disability
  as 100%. In 2024 the Supreme Court awarded Rs 52.31 lakh, more than 10 years after the accident.
