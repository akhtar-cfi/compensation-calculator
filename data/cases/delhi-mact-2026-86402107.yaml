what_mattered:
- Homemaker's income taken as Delhi unskilled minimum wage (Rs.14,842) following Arvind Kumar Pandey
- 47% permanent disability of both lower limbs translated into 24% functional disability given her household work
  and age 64; multiplier 7, no future prospects added
- Medical bills reimbursed by ECHS were excluded, but 2024-25 implant-infection and knee-replacement bills (Rs.6,05,015)
  were allowed as linked to the accident since the insurer led no medical evidence
- Interest denied on the late-filed medical bills until the award date
summary: A 64-year-old homemaker was injured in Delhi in 2019, and left with 24% functional disability. The insurer
  offered Rs 68,375, which was not accepted. The tribunal awarded Rs 12.85 lakh in 2026, 6.5 years after the accident.
