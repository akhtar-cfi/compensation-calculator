what_mattered:
- 'Losing a hand nearly ends a labourer''s ability to work: functional disability was 80%, not the 20% or 40% used
  below.'
- Without proof of income, the unskilled minimum wage (Rs 6,850 a month) applies, not a lower notional figure.
- Attendant charges were added and pain and suffering raised.
summary: A 25-year-old labourer in Madhya Pradesh lost his right hand below the elbow in a thresher mounted on a
  tractor in 2016. The tribunal awarded Rs 3.76 lakh on 20% disability and the High Court Rs 6.62 lakh on 40%. In
  2025 the Supreme Court awarded Rs 20.55 lakh on 80% functional disability, about 8 years after the accident.
