what_mattered:
- Salary slips proved gross salary Rs.59,034/month; 67 days of medical leave compensated even though it was paid
  leave
- Medical bills of Rs.1,02,427 reduced by Rs.66,226 already reimbursed by the employer, so only the unreimbursed
  part (plus Rs.2,709 other bills) was awarded
- 3% permanent disability of the right lower limb with full ankle movement was held to cause nil functional disability,
  so no loss of future earnings
- DTC bus hit the motorcycle from behind; negligence not disputed at final arguments
summary: A 54-year-old salaried counter in-charge was injured in Delhi in 2019, with no permanent disability. The
  insurer offered Rs 83,000, which was not accepted. The tribunal awarded Rs 3.86 lakh in 2026, 6.6 years after
  the accident.
