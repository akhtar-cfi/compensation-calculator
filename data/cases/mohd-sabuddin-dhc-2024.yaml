what_mattered:
- Riding without a licence or insurance is not contributory negligence unless it caused the accident or worsened
  the injuries.
- The registered owner of an uninsured vehicle stays liable until a transfer is recorded with the registering authority.
- Without documents, income was taken at the minimum wage.
summary: A 39-year-old who said he ran a meat shop suffered a serious head injury in Delhi in 2004, hit by an uninsured
  scooter. The tribunal awarded Rs 3.73 lakh, payable by the driver. In 2024, 20 years after the accident, the Delhi
  High Court raised the award to Rs 18.59 lakh and made the registered owner liable too.
