what_mattered:
- Employer witness's income evidence (Rs.800-1200/day, Rs.25,000-30,000/month) disbelieved; Delhi minimum wage for
  a skilled worker (Rs.19,473/month) used instead
- Treating orthopaedic doctor's evidence of L1/L2 wedge collapse fracture overrode the MLC's 'simple injury' opinion
  and the insurer's forensic-expert report
- No disability certificate, so no loss of earning capacity; instead a notional lump sum of Rs.3,00,000 plus 12
  months' loss of income; medical bills of Rs.1,08,799 reimbursed
- 25% contributory negligence because the injured crossed the road on foot at a red-light junction
summary: A welder was injured in Delhi in 2022, with no permanent disability. The tribunal awarded Rs 8.87 lakh
  in 2026 after a 25% cut for the victim's own negligence, 4.1 years after the accident.
