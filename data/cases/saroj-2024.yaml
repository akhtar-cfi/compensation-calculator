what_mattered:
- Age is proved by the school leaving certificate, not the Aadhaar card, which proves identity only.
- An appeal court should not swap a reasonable notional income (district rates) for a lower minimum wage just because
  another view is possible.
- Recomputing under Pranay Sethi (25% future prospects, standard consortium) left the final award below the tribunal's.
summary: A 45-year-old farmer who owned a tractor and a JCB machine died in Haryana in 2015. The tribunal awarded
  Rs 19.35 lakh; the High Court cut it to Rs 9.22 lakh. In 2024 the Supreme Court awarded Rs 15 lakh, about 9 years
  after the accident.
