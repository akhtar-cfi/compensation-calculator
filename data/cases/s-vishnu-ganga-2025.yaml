what_mattered:
- Income-tax returns are reliable evidence of income; the tribunal's notional Rs 60,000 a month was reasonable.
- Children taking over the family business does not mean the family lost nothing.
- The High Court's halving of income and lower multiplier went against settled law.
summary: A 57-year-old partner in a mill and his wife died together when an uninsured bus hit their car in Tamil
  Nadu. For the husband's death the tribunal awarded Rs 58.24 lakh; the High Court cut it to Rs 26.69 lakh. In 2025
  the Supreme Court restored the tribunal's award (and Rs 93.61 lakh for the wife).
