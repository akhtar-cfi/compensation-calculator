what_mattered:
- Income taken as the average of three pre-accident ITRs (Rs.49,838.38/month); no tax had been deducted
- Business/shop was not proved, so the doctor's evidence on work impact was ignored and 3% limb disability was taken
  as only 1.5% functional disability
- Treatment-cum-recuperation fixed at 14 months from bed-rest certificates, giving Rs.6,97,737 loss of income -
  far larger than the loss of earning capacity head
- Medi-claim reimbursements excluded but the out-of-pocket balance and two medi-claim premiums (Rs.26,236) were
  allowed as medical expenses
summary: A 46-year-old shopkeeper was injured in Delhi in 2021, and left with 1.5% functional disability. The insurer
  offered Rs 82,000, which was not accepted. The tribunal awarded Rs 10.82 lakh in 2025, 3.7 years after the accident.
