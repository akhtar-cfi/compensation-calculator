what_mattered:
- No proof of work or income (no employer/contractor examined), so Delhi minimum wage for a matriculate Rs.20,019/month
  used instead of claimed Rs.22,000
- 90% right-lower-limb disability (hip disarticulation amputation) assessed as 45% functional disability because
  his physical occupation was not proved; 40% future prospects, multiplier 17
- Only original medical bills (Rs.16,915) allowed since treatment was at a government hospital; 14 months' loss
  of income based on last prescription date
- Insurer's licence defence failed for lack of evidence; 17-day FIR delay excused
summary: A 28-year-old painter whose income was not proved was injured in Delhi in 2022, and left with 45% functional
  disability. The tribunal awarded Rs 30.55 lakh in 2025, 2.8 years after the accident.
