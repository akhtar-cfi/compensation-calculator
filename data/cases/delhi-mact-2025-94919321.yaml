what_mattered:
- Pension (Rs.9,810) plus part-time sweeper pay (Rs.10,000) was claimed, but on the claimant's own request Delhi
  unskilled minimum wage (Rs.13,896) was used
- Aged 68 by Aadhaar, so no future prospects and the lowest multiplier of 5; 1/3 personal-expense deduction
- Chargesheet alone proved negligence; driver, owner and insurer were all ex parte
- Conventional heads (consortium Rs.48,400, estate and funeral Rs.18,150 each) enhanced 20% over Pranay Sethi figures
summary: A 68-year-old widowed pensioner died in an accident in Delhi in 2018. The insurer offered Rs 50,000. The
  tribunal awarded Rs 6.41 lakh in 2025, 7.2 years after the accident.
