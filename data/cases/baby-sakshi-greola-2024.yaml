what_mattered:
- A 75% disability certificate was treated as 100% because, in practice, she could not lead an independent life.
- A child's lost earnings were based on the skilled-worker minimum wage plus 40% future prospects (following Kajal),
  not a token Rs 15,000 a year.
- A full-time skilled attendant for life was allowed, and pain and suffering raised to Rs 15 lakh.
summary: A 7-year-old girl was hit by a car on a zebra crossing in Delhi in 2009 and suffered a serious head injury.
  The tribunal awarded Rs 5.91 lakh and the High Court Rs 11.51 lakh. In 2024 the Supreme Court awarded Rs 50.87
  lakh, more than 15 years after the accident.
