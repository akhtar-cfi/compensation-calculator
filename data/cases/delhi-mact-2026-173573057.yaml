what_mattered:
- Victim died at home about six months after discharge with no post-mortem or medical link, so the claim was assessed
  as an injury claim, not a death claim
- No proof of the claimed Rs.22,000 security-guard salary, so Delhi matriculate minimum wage Rs.20,903/month used;
  6 months' loss of income for severe head injury (insurer's offer allowed only 2 months)
- Insurer's 30% contributory-negligence plea for a pedestrian crossing the road rejected (no zebra crossing or foot
  over-bridge shown)
- No medical bills, so only small lump sums for medicines, conveyance, diet and attendant
summary: A 63-year-old security guard whose income was not proved was injured in Delhi in 2023. The tribunal awarded
  Rs 2.25 lakh in 2026, 2.6 years after the accident.
