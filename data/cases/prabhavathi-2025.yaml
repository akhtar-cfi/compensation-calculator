- Income was restored to the last salary on his pay slip (Rs 62,725 a month), with 40% future prospects.
- The tribunal's 9% interest was restored.
summary: A 38-year-old hotel executive in Bengaluru was killed by a bus in 2016. The tribunal awarded Rs 75.97 lakh;
  the High Court found him 25% to blame and lowered his income, but stated a total of Rs 77.5 lakh. In 2025 the
  Supreme Court awarded Rs 1.21 crore, about 9 years after the accident.
