what_mattered:
- No employment proof, so income taken at Delhi unskilled minimum wage Rs.16,064/month (claimed Rs.15,000)
- 75% left-lower-limb disability (below-knee amputation) converted to 35% whole-body functional disability because
  he uses a prosthesis and, at 27, can learn new skills
- Only photocopies of medical bills and treatment was free at the hospital, so nil medical expenses; prosthesis
  awarded at proved invoice cost Rs.2 lakhs x 5 = Rs.10 lakhs
- Claimant rejected the insurer's Rs.20 lakh settlement offer and the tribunal awarded Rs.34,02,141, but interest
  was cut to 2.5 years for non-appearance
summary: A 27-year-old glass-fitting labourer was injured in Delhi in 2022, and left with 35% functional disability.
  The insurer offered Rs 20 lakh, which was not accepted. The tribunal awarded Rs 34.02 lakh in 2025, 3.8 years
  after the accident.
