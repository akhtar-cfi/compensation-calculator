what_mattered:
- No ITR or earnings record for his property-dealing work, so minimum wage for a matriculate in Delhi (Rs.21,917)
  was used
- 66% permanent disability of spine, left arm and left leg assessed as 40% functional disability for a property
  dealer who needs mobility, travel and driving
- No medical bills filed (treated in government hospital AIIMS) but Rs.10,000 awarded for miscellaneous treatment
  costs; 8 months' loss of income
- Insurer raised no statutory defence, so liability followed from the chargesheet and DAR
summary: A 38-year-old property dealer was injured in Delhi in 2024, and left with 40% functional disability. The
