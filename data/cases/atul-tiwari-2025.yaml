what_mattered:
- Notional income of Rs 15,000 a month for an engineering student, with 40% future prospects and multiplier 18,
  was upheld.
- Speech therapy, physiotherapy and attendant costs should not be cut to short fixed periods when doctors advise
  longer treatment.
- Non-pecuniary compensation was too low, so the Court fixed a lump sum.
summary: A third-year engineering student in Madhya Pradesh was left with 60% disability and impaired speech after
  an accident in 2009. The tribunal awarded Rs 19.44 lakh; the High Court raised only the loss-of-income head. In
  2025 the Supreme Court awarded Rs 48 lakh, the full amount originally claimed, more than 15 years after the accident.
