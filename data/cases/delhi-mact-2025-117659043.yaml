what_mattered:
- Salary of Rs.17,500/month accepted from the 2016 appointment letter (above the matriculate minimum wage of Rs.16,858);
  claimed overtime/commission income rejected for lack of documents
- Functional disability taken equal to the 80% medical (limb) disability because an AC technician must climb ladders
  and rooftops; 40% future prospects and multiplier 16 applied
- Prosthetic limb cost awarded for 6 replacements at Rs.3,70,000 each plus Rs.5,00,000 lump-sum maintenance (Rs.27,20,000)
- Contributory negligence for triple riding rejected (no causal link shown); insurer's permit/authorisation defence
  also rejected, so insurer pays in full
summary: A 33-year-old AC technician was injured in Delhi in 2018, and left with 80% functional disability. The
  tribunal awarded Rs 76.64 lakh in 2025, 7.3 years after the accident.
