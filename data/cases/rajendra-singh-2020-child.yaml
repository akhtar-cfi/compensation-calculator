what_mattered:
- Passengers in a horse cart cannot be blamed just because the cart was in the middle of the road; the 50% cut was set aside.
- The Court kept the notional income and refused a separate head for a child's future prospects, because a young child's future earnings cannot be estimated (Satender).
- The same judgment raised the award for her mother's death, decided alongside (see the homemaker case).
summary: A girl of about 12 died with her mother when a bus hit the horse cart they were travelling in, in 2012. The tribunal awarded Rs 1.6 lakh after a 50% cut for contributory negligence, and the High Court did not interfere. In 2020 the Supreme Court removed the cut and awarded Rs 2.95 lakh.
