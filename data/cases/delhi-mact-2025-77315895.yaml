what_mattered:
- Employment and Rs.16,000 salary not proved, so minimum wage of an unskilled worker in Delhi (Rs.16,064) was used
- 'Two skull surgeries (bone stored in abdomen, later cranioplasty) with difficulty comprehending and in fine hand
  work: 12% whole-body impairment raised to 20% functional disability'
- Original bills totalled only Rs.9,603 against Rs.5 lakh claimed, but large lump sums were given for pain (Rs.3
  lakh), amenities, expectation of life and disfigurement (Rs.2 lakh each)
- Because a legal offer was filed, the inquiry was framed as whether the offer was just and the claimant entitled
  to enhancement (Gohar Mohammed)
summary: A 38-year-old technician whose income was not proved was injured in Delhi in 2022, and left with 20% functional
  disability. The insurer offered Rs 1.23 lakh, which was not accepted. The tribunal awarded Rs 22.62 lakh in 2025,
  3.9 years after the accident.
