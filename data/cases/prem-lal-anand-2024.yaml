what_mattered:
- 'Overtaking a slow-moving tractor is an everyday act, not negligence: the 50% cut was set aside.'
- 25% future prospects were added for a self-employed person aged 40-50, with multiplier 15.
- Interest was reduced from 12% to 8%.
summary: A woman of about 45 who ran a fabrics business with her husband died in a crash involving a tractor in
  Uttar Pradesh. In 1997 the tribunal awarded Rs 1.01 lakh after a 50% cut for contributory negligence. In 2024,
  more than 27 years after that award, the Supreme Court set the cut aside and awarded Rs 11.25 lakh.
