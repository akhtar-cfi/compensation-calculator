what_mattered:
  - "The Supreme Court valued a homemaker's unpaid work at Rs 30,000 a month ('loss of domestic care'), revised by 10% every three years."
  - "Her claimed earnings from stitching (Rs 3,000 a month) had no proof, so the Rs 30,000 figure stood in as her income."
  - "40% was added for future prospects, as for a self-employed person under 40."
summary: >-
  A 35-year-old homemaker died in 2001. The tribunal awarded Rs 2.42 lakh and the High Court Rs 8.43 lakh.
  In 2026 the Supreme Court laid down that a homemaker's work is worth at least Rs 30,000 a month and awarded
  Rs 62.78 lakh, about 26 times the tribunal's figure, nearly 25 years after the accident.
