what_mattered:
- An income below the unskilled minimum wage was rejected; given his sport and training the Court took Rs 7,500
  a month, plus 40% future prospects.
- Total dependence justified attendant, future medical, physiotherapy and marriage-prospects heads that the lower
  courts had not given.
- The Court directed that compensation be paid by direct transfer into the claimant's bank account.
summary: A 21-year-old student and state-level volleyball player was left paralysed in all four limbs in Punjab
  in 2014. The tribunal awarded Rs 5.16 lakh and the High Court Rs 15.26 lakh. In 2025 the Supreme Court awarded
  Rs 36.84 lakh, nearly 11 years after the accident.
