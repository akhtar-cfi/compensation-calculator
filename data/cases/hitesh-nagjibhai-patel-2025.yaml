what_mattered:
  - "A child's income must be the state's skilled minimum wage at the time (Rs 227.85 a day in Gujarat in 2012, about Rs 6,836 a month)."
  - "Where income is not proved, the Court said insurers must place the minimum-wage notification before the tribunal."
