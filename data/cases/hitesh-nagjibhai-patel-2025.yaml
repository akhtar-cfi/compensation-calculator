summary: >-
  An 8-year-old child was left with 90% functional disability in 2012. The tribunal awarded Rs 3.9 lakh and the
  High Court Rs 8.65 lakh. In 2025 the Supreme Court awarded Rs 35.9 lakh, about 9 times the tribunal's figure,
  nearly 13 years after the accident.
