what_mattered:
- No documents for claimed Rs.45,000-50,000/month income or for work as a whitewash contractor, so unskilled minimum
  wage (Rs.8,554) used
- 34% permanent disability of right lower limb halved to 17% functional disability
- Insurer's 30% contributory-negligence allegation rejected because no evidence of a head-on collision was led
- Only Rs.65,275 of the Rs.4 lakh claimed medical expenses was supported by original bills
summary: A 32-year-old whitewash contractor whose income was not proved was injured in Delhi in 2014, and left with
  17% functional disability. The insurer offered Rs 46,286, which was not accepted. The tribunal awarded Rs 6.90
  lakh in 2025, 11.3 years after the accident.
