what_mattered:
- Income shown in income-tax returns must be used; there was no material to disbelieve the returns.
- State legal services authority guidelines are only a guide where income is not proved (mainly for Lok Adalat settlements);
  they do not bind tribunals or High Courts.
summary: A 28-year-old was left with 63% disability in Rajasthan in 2007. The tribunal awarded Rs 15.51 lakh on
  the income in his tax returns; the High Court cut it to Rs 7.35 lakh using legal services authority guidelines.
  In 2024 the Supreme Court restored the tribunal's award, more than 17 years after the accident.
