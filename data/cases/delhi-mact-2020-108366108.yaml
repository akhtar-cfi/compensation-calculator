what_mattered:
- His claimed work as a building-material supplier earning Rs.15,000/month was not proved, and nothing showed he lived
  or earned in Delhi (his voter ID had a U.P. address), so the U.P. unskilled minimum wage was used (Rs.191.38 x 26
  days = Rs.4,976/month)
- Age 30 taken from the voter-ID year of birth (the claimants said 35), giving multiplier 17; 40% future prospects and
  a 1/5 personal-expense deduction for eight dependants gave loss of dependency of Rs.11,37,000
- Rs.40,000 consortium to each of the eight claimants (spousal for the wife, parental for each child) = Rs.3,20,000,
  plus Rs.15,000 each for funeral expenses and loss of estate
- Negligence held proved although the claimed eyewitness was disbelieved, because the undisputed site plan showed all
  three vehicles burnt at the spot and the driver and owner never testified
- Insurer must pay first but may recover from the driver and owner, because the licence number had been issued to
  someone else and the tanker's permit and fitness were never produced
summary: A 30-year-old man whose income was not proved died of burn injuries in 2013 after a collision between a
  chemical tanker and the dumper he was travelling in at Noida set the vehicles on fire. The Delhi tribunal awarded
  Rs 14.87 lakh in 2020, 6.6 years after the accident.
