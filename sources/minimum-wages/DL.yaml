# Delhi (NCT) minimum wages: dated revisions from official Labour Department orders.
# Rates are monthly (per-day rate = monthly / 26). Every row checked: previous rate + DA = new rate (exceptions in notes).
# Do NOT add a rate from an aggregator or news site without the official order: a FORGED order for 1 Oct 2025
# (Rs 19,846 unskilled) circulated widely and was reported by compliance publishers (see gaps).
code: DL
name: Delhi (NCT)
official_sources:
  - url: https://labour.delhi.gov.in/labour/current-minimum-wage-rate
    description: Labour Department, GNCTD - list of minimum-wage and DA orders (archived copy of 27 Jul 2026 used)
    language: en
revision_pattern: >-
  Base rates last fixed by notification of 22.10.2019; dearness allowance (DA) added every 1 April and 1 October
  from six-monthly All-India CPI averages, by order of the Labour Commissioner (orders often issued weeks later).
zones: [All]
category_notes: >-
  Orders give unskilled, semi-skilled and skilled rates, plus clerical/supervisory rates (non-matriculate = semi-skilled
  rate, matriculate = skilled rate, graduate and above higher). There is no 'highly skilled' category: highly_skilled is
  null and the engine falls back to skilled, with a warning.
days_per_month: 26
# The official order list (Wayback capture of 27 Jul 2026) shows no order after 1 Apr 2025.
last_checked: 2026-07-27
