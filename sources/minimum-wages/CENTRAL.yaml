# Central sphere minimum wages (Chief Labour Commissioner / Labour Bureau), per DAY, by Area A/B/C.
# Schedule loaded: CONSTRUCTION OR MAINTENANCE OF ROADS OR RUNWAYS OR IN BUILDING OPERATIONS (S.O. 188(E), 19 Jan 2017).
# Rates = basic + VDA, as printed in each order; every row checked (basic + VDA = total).
# Central rates apply to central-sphere employments only. For a state accident they are a labelled fallback, never a
# silent substitute for the state's own rates. Which schedule to use is a decision for legal sign-off.
# NOTE: figures quoted elsewhere as "Central" minimum wages (e.g. Rs 13,599 / 15,057 / 20,361 a month) are BASIC ONLY,
# without VDA, and understate the wage by about a third.
code: CENTRAL
name: Central sphere - construction schedule
official_sources:
  - url: https://clc.gov.in/clc/min-wages
    description: Chief Labour Commissioner (C) - VDA orders by scheduled employment (archived copy of 19 Apr 2026 used)
    language: en
revision_pattern: >-
  Basic rates fixed by notifications of 19 Jan 2017; VDA revised every 1 April and 1 October from CPI-IW. From
  1 Oct 2026 the VDA orders are issued by the Labour Bureau, Chandigarh, under the Code on Wages, 2019 (s.69(2)).
zones: [C, B, A]
category_notes: >-
  Areas: A, B and C by city (Annexure I of each order; A = largest cities). The first zone (C, lowest) is used when no
  area is given, with a warning. Categories: unskilled; semi-skilled/unskilled supervisory; skilled/clerical; highly
  skilled.
days_per_month: 26
