# Approximate personal income-tax for resident individuals below 60, used ONLY when actual tax (TDS) is unknown.
# Courts deduct the tax actually payable (Pranay Sethi). Surcharge and professional tax are ignored (warning).
# Regime: old regime up to FY 2022-23; new (default) regime from FY 2023-24.
# Rebate (s.87A): full rebate up to rebate_upto of taxable income. Under the new regime (FY 2023-24 on), marginal relief
# caps the tax just above that threshold at the income above it; cess is then added. The old regime has no such relief,
# so its take-home income really does dip just above the threshold.
# Checked 10 Oct 2026 against official sources (CBDT circulars, incometax.gov.in, Finance Bill memoranda, PIB):
# every value matches. FY 2012-13 to 2017-18 added 25 Oct 2026 from each year's Finance Bill memorandum (Part III of
# the First Schedule: the rates for deduction from salaries that year), for accidents before April 2018 (legal review
# A-27): cess 3% (education 2% and secondary and higher education 1%) until FY 2017-18, and no standard deduction
# before FY 2018-19 (allowances that were exempt then, such as transport allowance, are not modelled). A year with no
# table gets no tax figure: another year's table is never used. From 1 Apr 2026 the Income-tax Act, 2025 applies
# (rebate s.156, new-regime rates s.202; 'tax year').
# verified: false = not yet signed off by the legal reviewers.
id: income_tax
verified: false
cess_pct: 4
years:
  - fy: "2012-13"
    regime: old
    cess_pct: 3
    standard_deduction: 0
    rebate_upto: 0
    rebate_max: 0
    slabs: [[200000, 0], [500000, 10], [1000000, 20], [null, 30]]
    note: "No s.87A rebate yet. No surcharge for individuals that year."
    checked_against:
      - https://www.indiabudget.gov.in/budget2012-2013/ub2012-13/mem/mem1.pdf
    check_note: "Finance Bill memorandum as introduced; the rates for individuals below 60 in Part III of the First Schedule."
