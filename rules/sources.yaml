# Citation registry, and the authority register the legal review asked for (B-13): for each judgment its bench,
# grade, what it is relied on for (holding, paragraph, factual limits) and how later judgments treated it.
# `verified: false` until the legal reviewers sign off (see docs/methodology.md).
# Fields we could not confirm (exact dates / reporter citations / claim types) are left out rather than guessed.
# `weight` (ratio, obiter, applied) is set only where the judgment's own role makes it plain; the rest is for the
# advocate to classify (B-13). Paragraph numbers are the official ones unless marked SCC.
- id: mv_act_1988
