- id: kirti_2021
  title: Kirti v Oriental Insurance Co. Ltd.
  citation: (2021) 2 SCC 166; 2021 INSC 6
  court: SC
  bench: 3
  grade: P
  url: https://indiankanoon.org/doc/106405133/
  propositions:
    - holding: Without proof of income, the minimum wage in force on the accident date; a higher category may be used for an educated person.
      para: 10, 12
    - holding: Future prospects apply to notional incomes.
      para: 13-14
    - holding: Unpaid household work has an economic value.
