  date: 2026-06-11
  bench: 2
  grade: P
  url: https://indiankanoon.org/doc/158690569/
  propositions:
    - holding: >-
        ₹30,000 a month for loss of domestic care when a homemaker dies, where she ran the household, cared for
        the children and supported the spouse (or, for parents, supported them), revised 10% every three years,
        and in addition to her own earnings.
      para: 13, 20, 22
      limits: Death claims; women homemakers; all three roles met. Applied to an accident of 2001.
