- id: kajal_2020
  title: Kajal v Jagdish Chand
  citation: (2020) 4 SCC 413; 2020 INSC 135
  court: SC
  date: 2020-02-05
  bench: 2
  grade: P
  url: https://indiankanoon.org/doc/180443810/
  propositions:
    - holding: An injured child's income taken at the skilled minimum wage; multiplier 18.
      para: 20, 24
      limits: An injury claim (a child).
    - holding: An attendant during treatment, and one carer for life valued at the skilled wage (₹4,846 a month, rounded to ₹5,000).
