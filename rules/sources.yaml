- id: jan_vishwas_2026
  title: Jan Vishwas (Amendment of Provisions) Act, 2026 (Act 8 of 2026), amendments to the Motor Vehicles Act
  kind: statute
  claim: statute
  grade: S
  propositions:
    - holding: >-
        A tribunal may entertain a claim within a further twelve months after the six-month limit in s.166(3) if
        sufficient cause is shown (as summarised by the Government; the legal review also cites ss.168(4), 164(4)
        and 163(3)).
      limits: Known from the Government's summary and the legal review; the section text and its commencement date are not yet read.
  treatment: The legal review gives 15 Aug 2026 as the commencement for the Motor Vehicles Act amendments; not yet confirmed.
- id: sarla_verma_2009
  title: Sarla Verma v Delhi Transport Corporation
  citation: (2009) 6 SCC 121; 2009 INSC 506
  court: SC
  bench: 2
  grade: P
  url: https://indiankanoon.org/doc/837924/
  propositions:
    - holding: >-
        Personal deduction: a half for an unmarried person; for a married person a third (2-3 dependants), a
        quarter (4-6) or a fifth (more). The scale starts at two or three dependants.
      para: 14-15 (SCC 30-32)
    - holding: An unmarried person who supported a large dependent family may have a third deducted instead of a half; no number of dependants is fixed.
      para: "15"
    - holding: The multiplier is taken from a table by age.
      para: 21 and its table (SCC 42)
  treatment: Paras 30-32 and 42 (SCC) endorsed by the Constitution Bench in Pranay Sethi (2017), para 61(v)-(vi).
- id: pranay_sethi_2017
  title: National Insurance Co. Ltd. v Pranay Sethi (Constitution Bench)
  citation: (2017) 16 SCC 680; 2017 INSC 1068
  court: SC
  date: 2017-10-31
  bench: 5
  grade: P
  url: https://indiankanoon.org/doc/139996215/
  propositions:
    - holding: >-
        Future prospects: 50%, 30% or 15% of salary less tax for a permanent job (under 40, 40-50, 50-60); 40%, 25%
        or 10% of established income less tax for the self-employed or those on a fixed salary.
      para: 61(iii)-(iv) (SCC 59.3-59.4)
      weight: ratio
    - holding: Loss of estate ₹15,000, consortium ₹40,000 and funeral ₹15,000, to be raised by 10% every three years; no start date is given.
      para: 61(viii)
      weight: ratio
    - holding: Approved Reshma Kumari's approach to the multiplier.
      para: "46"
  treatment: A Constitution Bench; binds every smaller bench.
- id: reshma_kumari_2013
  title: Reshma Kumari v Madan Mohan
  citation: (2013) 9 SCC 65; 2013 INSC 200
  court: SC
  bench: 3
  grade: P
  url: https://indiankanoon.org/doc/86908489/
  propositions:
    - holding: A multiplier of 15 for victims up to 15, whatever the type of claim.
      para: 40(ii)
      weight: ratio
      limits: Ties the 15 to the old Second Schedule, which has since been removed.
  treatment: >-
    Approved in Pranay Sethi (2017) para 46; followed for an injured child in Divya (2022) and Rushi Thapa (2024).
    Kajal (2020) and Hitesh Patel (2025), two-judge benches, used 18 without discussing it.
- id: raj_kumar_2011
  title: Raj Kumar v Ajay Kumar
  citation: (2011) 1 SCC 343; 2010 INSC 703
  court: SC
  bench: 2
  grade: P
  url: https://indiankanoon.org/doc/153578069/
  propositions:
    - holding: The heads of injury compensation (medical, earnings lost during treatment, future loss, pain, amenities); medical and functional disability are assessed separately.
      para: 5, 7-10 (SCC 9-13)
    - holding: 100% loss of earning capacity where the person cannot do their earlier work; when earning loss is total, only a token sum is due for amenities.
      para: "10"
