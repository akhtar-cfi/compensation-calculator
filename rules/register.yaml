      - { id: D-3, status: conditional }
      - { id: D-6, status: not_stated }
    flagged:
      - review: D-3
        point: >-
          Delhi wages from March 2017 to October 2018: the Delhi High Court quashed the 2017 notification on 4 Aug
          2018 and the Supreme Court restored its rates from 1 Nov 2018.
  - id: wage_freshness
    section: data
    step: When a wage on file may be out of date
    kinds: [death, injury]
    type: fixed
    now: >-
      A caution when the wage on file took effect more than 7 months before the accident and the source has not
