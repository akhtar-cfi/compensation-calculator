  # ---------------------------------------------------------------- claim
  - id: eligibility
    section: claim
    step: When no estimate is given
    kinds: [death, injury]
    type: fixed
    now: >-
      No estimate for an owner driving alone with no other vehicle involved; for a vehicle never traced, where the
      hit-and-run scheme's amounts are shown (₹2,00,000 for a death or ₹50,000 for grievous hurt for accidents from 1
      Apr 2022; ₹25,000 and ₹12,500 under the 1989 scheme before that), with no deduction for cashless treatment;
      and where no-fault money was accepted through the insurer's settlement, which ends the claim.
    decided: >-
      Show the s.161 amounts subject to eligibility and the scheme's conditions, kept apart from s.166 estimates and
      from cashless treatment, with no deduction for cashless treatment; check which amounts applied to older
      accidents (C-8).
    authorities:
      - { source: mv_act_1988, para: "ss.161, 166(1)" }
      - { source: gic_hit_and_run_2023 }
    review:
      - { id: C-8, status: approve, done: true }
    changes:
      - date: 2026-10-24
        what: The hit-and-run amounts follow the accident date (C-8).
  - id: limitation
    section: claim
    step: Time limit for filing the claim
    kinds: [death, injury]
    type: conflict
    now: >-
      When no filing date is given and 6 months or more have passed, a caution says s.166(3) sets 6 months but the
      Supreme Court has directed that claims not be dismissed as time-barred while it decides the challenge.
    decided: >-
      Rewrite around the amended s.166(3) (a further 12 months with sufficient cause) and whatever interim
      directions still stand. Never say a claim after 18 months is maintainable, or that every claim after 6 months
      is barred. Mandatory before launch (B-4).
    authorities:
      - { source: mv_act_1988, para: "s.166(3)" }
      - { source: jan_vishwas_2026 }
      - { source: bhagirathi_dash_2025 }
    review:
      - { id: B-4, status: conditional }
    flagged:
      - review: B-4
        point: >-
          Late claims: the amended s.166(3) (its text and commencement not yet read here) and how far the Supreme
          Court's interim directions still apply.
  - id: interest
    section: claim
    step: Interest and the value of an offer over time
    kinds: [death, injury]
    type: practice
    now: >-
      Interest is never in the amount; it is shown at 6, 7.5 and 9% a year for a 6-year wait. The offer check
      assumes 7.5% interest, a 7% discount rate and no lawyer's fee, each changeable.
    decided: >-
      Compensation without interest first, interest separately (s.171), and the discount rate, waiting time and
      legal costs in an optional module with explained, adjustable inputs. The 12-month disposal target in the
      amended s.168(4) is not a promised date (C-6).
    authorities:
      - { source: mv_act_1988, para: "s.171" }
    review:
      - { id: C-6, status: conditional }
  # ---------------------------------------------------------------- presentation
  - id: result_model
    section: presentation
    step: How the result is shown
    kinds: [death, injury]
    type: fixed
    now: >-
      Three figures (low, headline, high). A bar is drawn only when the high figure is at most 1.75 times the low
      (2.5 for injuries) and the spread is at least 5% of the headline, with a list of what moves the amount.
    decided: >-
      One headline, and alternatives only where the law is split, each with its judgment; for missing facts, 'if
      you can prove…' notes instead. The bar limits are display choices, not law (C-4).
    review:
      - { id: C-4, status: conditional }
  - id: wording
    section: presentation
    step: What the amount is called
    kinds: [death, injury]
    type: fixed
    now: >-
      'Estimated compensation under the MACT framework, based on the information provided', on the result, in the
      share text, the published method and the command line, in English and Hindi; no 'legal entitlement'.
    review:
      - { id: C-3, status: approve, done: true }
    changes:
      - date: 2026-10-24
        what: "'Legal entitlement' and 'the Supreme Court's method' replaced (C-3)."
  - id: offer_check
    section: presentation
    step: Checking an insurer's offer
    kinds: [death, injury]
    type: fixed
    now: >-
      The offer, the estimate and the difference, with what waiting would be worth after interest and fees; no
      label calling the offer fair or unfair, and nothing that tells the family to accept or refuse. Without a
      disability certificate it says the estimate is not complete yet.
    review:
      - { id: C-1, status: approve, done: true }
    changes:
      - date: 2026-10-24
        what: The verdict labels (far below … above) are gone; the check shows the difference instead (C-1).
  - id: questions
    section: presentation
    step: Which questions the website asks
    kinds: [death, injury]
    type: fact
    now: >-
      Not asked: hospital or attendant days, the number of carers, future medical costs, money already received, a
      fault percentage, other dependants, or extra or late tax returns.
    decided: >-
      Add only legally material questions, shown when they apply: occupation, place of work, salary proof,
      relationships, financial support, homemaker roles, continuing disability, care needs and money already
      received. The revised questions go to the legal reviewer (C-2).
    review:
      - { id: C-2, status: conditional }
  - id: practice_spread
    section: presentation
    step: How real awards compare
    kinds: [death, injury]
    type: practice
    now: Shown for Delhi claims only, labelled 'Delhi tribunal awards, 2024-26', with the number of awards.
    decided: >-
      Delhi only, with its jurisdiction, period and limits stated; re-measured after any change to the method
      (D-5).
    authorities:
      - { source: delhi_awards_backtest_2026 }
    review:
      - { id: D-5, status: approve, done: true }
    changes:
      - date: 2026-10-24
        what: Re-measured after A-12 (deaths, middle half of awards 0.70 to 1.17 times the estimate, 112 awards).
      - date: 2026-10-24
        what: Shown for Delhi claims only (D-5).
  - id: sign_off
    section: presentation
    step: Legal sign-off of the rules
    kinds: [death, injury]
    type: fixed
    now: >-
      Every rules file is marked unverified, and results carry one line: 'Method not yet signed off by a lawyer'.
      This register records each authority's bench, grade, paragraph, limits and later treatment.
    decided: >-
      Sign off the method, the code, the rules files, settings, tax and wage tables and the public text against the
      same version; keep a change log and re-approve after substantive changes (B-14). Complete the authority
      register, including the claim type and whether each holding is binding (B-13).
    review:
      - { id: B-13, status: conditional }
      - { id: B-14, status: conditional }
    changes:
