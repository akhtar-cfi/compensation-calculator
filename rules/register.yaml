# The rule register: one row per step of the calculation, with what the calculator does now, the authority it rests
# on, what kind of step it is, and the legal review's decision on it (legal review, safeguards F: "every output
# should identify the statutory provision, governing judicial rule, legally material inputs and any fallback
# assumption"). The rules page is generated from this file, so the two cannot drift.
#
# type   fixed     settled law: one value, the same everywhere, cited
#        fact      depends on evidence the family has: asked, or assumed and said so, or left out
#        conflict  the law is split or open: a provisional rule and its alternative, each cited (flagged below)
#        practice  an estimate from tribunal awards, never presented as law
#        withheld  not computed automatically until its legal basis is settled
# The type is the legal review's classification. `now` is what the code does today; `decided` is what the review
# decided, where that differs. A review item is `done` once the calculator does what the decision says.
# Authorities are source ids from rules/sources.yaml, with the paragraph relied on.
id: register
description: >-
  One row per step of the calculation: what the calculator does now, the authority, the kind of step, and the legal
  review's decision on it. Points where no binding rule exists are flagged.
review:
  title: Legal review of "Decisions and checks needed" (draft v2, 16 Oct 2026)
  received: 2026-10-24
rows:
  # ---------------------------------------------------------------- income
  - id: income_salary
    section: income
    step: Income from a salary
    kinds: [death, injury]
    type: fact
    now: >-
      The monthly salary entered, less income tax: the tax on the slip, or tax worked out from the slabs for the
      accident's financial year and marked as an estimate.
    decided: >-
      Prefer tax returns, Form 16 or payroll records. Estimate tax from the slabs only when enough is known, and say
      it is an estimate, never tax proved paid (A-30). Rely on Kirti and Meenakshi only for what each actually
      decided (B-5).
    authorities:
      - { source: pranay_sethi_2017, para: "61(iii)-(iv)" }
      - { source: meenakshi_2024, para: "6-13" }
      - { source: vimal_kanwar_2013, para: "21-23" }
    review:
      - { id: A-30, status: conditional }
      - { id: B-5, status: conditional }
    flagged:
      - review: A-30
        point: >-
          Tax when the salary slip shows none: Vimal Kanwar held it wrong to deduct tax without evidence; Meenakshi
          upheld a deduction on its own facts.
  - id: income_itr
    section: income
    step: Income from tax returns
    kinds: [death, injury]
    type: fact
    now: >-
      Salaried: the latest return before the accident, never an average. Self-employed: the average of up to three
      returns. Each return is net of its own year's tax (the tax shown on the return when given). A return filed
      after the accident counts only when records from the time back it, in every figure; otherwise it is left out
      and the result says what it would add. The website asks for the latest return before the accident and,
      optionally, its tax.
    decided: >-
      Record each return's year, filing date and supporting records. Self-employed: a representative period from
      the returns; later returns count when supporting records back them. Salaried: no automatic average of three
      returns (A-5, B-7).
    authorities:
      - { source: rashmirekha_2026, para: "18-20" }
    review:
      - { id: A-5, status: approve, done: true }
      - { id: B-7, status: approve, done: true }
    changes:
      - date: 2026-10-25
        what: >-
          A salaried person's latest return is used instead of an average; a later-filed return needs records from
          the time and no longer raises the high figure on its own; each return is net of its own year's tax, or
          the tax shown on it (A-5, B-7).
  - id: income_no_proof
    section: income
    step: Income with no proof (minimum wage)
    kinds: [death, injury]
    type: fact
    now: >-
      The minimum wage on the accident date in the state where the claim is filed, at the skill level of the
      occupation picked from the calculator's list (low figure: unskilled; unknown occupations are unskilled).
      A graduate with no particular job shown gets the skilled rate; the highly skilled rate only for someone
      working as a professional. Central-sphere rates (the construction schedule, lowest city group if none is
      given) are offered only as the place of work for central-sphere employment, and the result says so; the page
      no longer suggests them when a state's wages are missing.
    decided: >-
      The occupation's wage once the occupation-to-skill list is checked (A-2). Record the accident place, the
      usual place of work and the filing place separately, and prefer the wage of the established employment
      (A-18). No generic Central substitute (A-19). The skilled wage for graduates unless a higher category is
      supported (A-20).
    authorities:
      - { source: kirti_2021, para: "10, 12" }
    review:
      - { id: A-2, status: conditional }
      - { id: A-18, status: conditional }
      - { id: A-19, status: hold, done: true }
      - { id: A-20, status: approve, done: true }
    points: [mw_category]
    flagged:
      - review: A-18
        point: >-
          Which state's wage for someone who works in one state and claims in another: a claim may be filed where
          the claimant lives or works, where the accident happened, or where the defendant lives (s.166(2)).
    changes:
      - date: 2026-10-25
        what: >-
          A graduate with no particular job shown now gets the skilled rate, not the highly skilled one; that rate
          is kept for someone working as a professional (A-20).
      - date: 2026-10-25
        what: >-
          Central-sphere rates are no longer suggested as a rough stand-in for a state's missing wages; they are
          for central-sphere work only, and the result says so (A-19).
  - id: income_homemaker
    section: income
    step: Income for a homemaker who died
    kinds: [death]
    type: fact
    now: >-
      ₹30,000 a month for every homemaker's death in the headline and the high figure (revised 10% every three years
      from 11 Jun 2026); the low figure uses the state's unskilled minimum wage.
    decided: >-
      Ask which roles she performed and whether she also earned. Apply Shishu Pal's ₹30,000, revised cumulatively,
      where its conditions are met, in addition to her own earnings; otherwise an evidence-based value (Kirti). Check
      the full computation and the revision dates first (A-1).
    authorities:
      - { source: shishu_pal_2026, para: "13, 20, 22" }
      - { source: kirti_2021, para: "26(c)" }
      - { source: ganga_devi_2026 }
    review:
      - { id: A-1, status: conditional }
    points: [homemaker_income]
  - id: income_child_death
    section: income
    step: Income for a child who died
    kinds: [death]
    type: conflict
    now: >-
      The skilled minimum wage plus 40% future prospects in the headline. The low figure uses ₹25,000 a year × 15
      (Kurvan Ansari), so the lost income is always ₹3,75,000.
    decided: >-
      Remove the ₹25,000 floor. A notional income justified on the facts, with the accident-period skilled wage as a
      reference, without claiming a rule that binds every child's death. A short precedent note comes first (A-3).
      Kurvan Ansari stays in the register for the old s.163A schedule only (B-1).
    authorities:
      - { source: hitesh_patel_2025, para: "9, 15" }
      - { source: kajal_2020, para: "20" }
      - { source: kurvan_ansari_2021, para: "16" }
    review:
      - { id: A-3, status: conditional }
      - { id: B-1, status: approve }
    points: [minor_death_income]
    flagged:
      - review: A-3
        point: >-
          No Supreme Court rule for a child's death in an ordinary claim: Kurvan Ansari's ₹25,000 came from the old
          s.163A schedule, and Hitesh Patel's skilled wage from an injury case.
  - id: income_student
    section: income
    step: Income for a student
    kinds: [death, injury]
    type: fact
    now: >-
      The skilled minimum wage on the accident date, in every figure. Mohinder Kaur's ₹12,000 a month (an accident
      in 2000) is no longer used.
    decided: >-
      No fixed ₹12,000: that judgment is a comparator only (B-8). A valuation from the course, qualifications,
      expected occupation and the accident-period wages needs a justified method first (A-4).
    authorities:
      - { source: kirti_2021, para: "12" }
      - { source: mohinder_kaur_2026, para: "26" }
    review:
      - { id: A-4, status: approve, done: true }
      - { id: B-8, status: approve, done: true }
    changes:
      - date: 2026-10-24
        what: The ₹12,000 for a professional course is no longer used; every figure takes the skilled wage (A-4, B-8).
  - id: income_pensioner
    section: income
    step: Income for a pensioner
    kinds: [death, injury]
    type: fixed
    now: >-
      The deceased's own pension, in full, in every figure; a family pension is never deducted, and the website no
      longer asks for it. An injured pensioner's pension is still treated as lost income.
    decided: >-
      Never deduct family pension, in any figure (A-6, B-6). Value the deceased's own pension as lost income; for an
      injury, account for a pension that continues (still to build).
    authorities:
      - { source: vimal_kanwar_2013, para: "19" }
      - { source: helen_rebello_1998 }
    review:
      - { id: A-6, status: approve }
      - { id: B-6, status: approve, done: true }
    changes:
      - date: 2026-10-24
        what: The low figure no longer takes the family pension off a pensioner's income (A-6, B-6).
  - id: income_retired
    section: income
    step: Income for a retired person without a pension
    kinds: [death, injury]
    type: fact
    now: >-
      The low figure counts no income, so only the fixed amounts are paid. The headline uses the unskilled minimum
      wage, with no future prospects.
    decided: >-
      Ask whether paid work, a business or valuable household work continued, and use proved earnings or a
      supported notional income. Never zero, or a wage, from 'retired' alone (A-7).
    review:
      - { id: A-7, status: conditional }
    points: [non_earning_elderly]
  - id: injured_homemaker
    section: income
    step: Income for an injured homemaker
    kinds: [injury]
    type: conflict
    now: >-
      The low figure and the headline use the state's unskilled minimum wage. The high figure uses ₹30,000 a month,
      by analogy with Shishu Pal.
    decided: >-
      An evidence-based notional income; ask which household work the person can no longer do and whether care is
      needed. No automatic ₹30,000 (A-8).
    authorities:
      - { source: kirti_2021 }
      - { source: shishu_pal_2026, para: "20, 23.4" }
      - { source: uma_rani_2026 }
      - { source: ganga_devi_2026 }
    review:
      - { id: A-8, status: conditional }
    points: [injured_homemaker_income]
    flagged:
      - review: A-8
        point: >-
          No authority for an injured homemaker: Shishu Pal and Kirti are death cases, and the Delhi High Court has
          gone both ways (₹10,000 a month in Uma Rani; Shishu Pal refused in Ganga Devi).
  # ---------------------------------------------------------------- formula
  - id: future_prospects
    section: formula
    step: Future prospects
    kinds: [death, injury]
    type: fixed
    now: >-
      50, 30 or 15% for a permanent job and 40, 25 or 10% for others, by age; none from 60. At exactly 50 the lower
      band. Whether the job was permanent and whether the salary is proved are separate answers: without slips the
      occupation sets the minimum wage, the permanent-job rate is kept, and the result says it rests on proof that
      the job was permanent.
    decided: >-
      Ask for the salary proof and for whether the job was permanent as separate questions (A-17). At exactly 50,
      the higher band provisionally, then one verified boundary rule (A-21).
    authorities:
      - { source: pranay_sethi_2017, para: "61(iii)-(iv)" }
      - { source: kirti_2021, para: "13-14" }
      - { source: sushila_2026, para: "25" }
      - { source: sidram_2022, para: "31" }
    review:
      - { id: A-17, status: approve, done: true }
      - { id: A-21, status: conditional }
    flagged:
      - review: A-21
        point: Future prospects at exactly 50 years old fall at the boundary of two bands.
    changes:
      - date: 2026-10-24
        what: >-
          Without salary slips, the occupation now sets the minimum wage for a salaried job, and the result names
          the assumption that the job was permanent and the proof a tribunal will want (A-17).
  - id: personal_deduction
    section: formula
    step: Personal deduction
    kinds: [death]
    type: fixed
    now: >-
      A half if unmarried; if married, a third (2-3 dependants), a quarter (4-6) or a fifth (more). With one
      dependant of any kind (spouse, child or parent), a half in the low figure and a third in the headline. An
      unmarried person gets a third where the answers say a large family lived on their income, whatever its size;
      for 'not sure', a half, with what a third would add. A parent counts as a dependant only when the answer says
      so; for 'not sure' the result shows what it would add if they were.
    decided: >-
      A third where the spouse is the only dependant, not extended to a sole parent or child (A-10). A half for the
      unmarried, a third where a large dependent family is shown, with no fixed number (A-11). Parents count as
      dependants only where support is shown; consortium is decided separately (A-22).
    authorities:
      - { source: sarla_verma_2009, para: "14-15 (SCC 30-32)" }
      - { source: sushila_2026, para: "24, 27" }
    review:
      - { id: A-10, status: conditional }
      - { id: A-11, status: approve, done: true }
      - { id: A-22, status: approve, done: true }
    points: [spouse_only_deduction]
    flagged:
      - review: A-10
        point: >-
          One dependant who is not a spouse (one child or one parent): Sarla Verma's scale starts at two or three
          dependants, and Sushila decided only a sole spouse.
    changes:
      - date: 2026-10-24
        what: "A parent answered 'not sure' is no longer counted as a dependant; the effect if they were is shown (A-22)."
      - date: 2026-10-24
        what: >-
          An unmarried person's family is asked whether a large family lived on their income: a third if so, in
          every figure, with no fixed number of dependants; before, a third applied only in the high figure and only
          from 3 dependants (A-11).
  - id: multiplier
    section: formula
    step: Multiplier
    kinds: [death, injury]
    type: fixed
    now: >-
      From the Sarla Verma table by the age of the person who died or was injured, never split; 5 for every age
      above 65.
    authorities:
      - { source: sarla_verma_2009, para: "21 and its table (SCC 42)" }
      - { source: preetha_krishnan_2025, para: "16-18" }
    review:
      - { id: A-16, status: approve, done: true }
    changes:
      - date: 2026-10-24
        what: No caution above 70; the table's last category covers every age above 65 (A-16).
  - id: multiplier_under_15
    section: formula
    step: Multiplier for a child under 15
    kinds: [death, injury]
    type: conflict
    now: The low figure uses 15; the headline and the high figure use 18, for deaths and injuries alike.
    decided: >-
      15 for a child's death provisionally, following the larger bench. A separate precedent note for an injured
      child, with 18 shown as the alternative supported by later two-judge decisions (A-9).
    authorities:
      - { source: reshma_kumari_2013, para: "40(ii)" }
      - { source: pranay_sethi_2017, para: "46" }
      - { source: divya_2022 }
      - { source: rushi_thapa_2024, para: "8" }
      - { source: kajal_2020, para: "24" }
      - { source: hitesh_patel_2025, para: "13" }
    review:
      - { id: A-9, status: conditional }
    points: [under_15_multiplier]
    flagged:
      - review: A-9
        point: >-
          15 (Reshma Kumari, three judges, approved by the Constitution Bench) or 18 (Kajal, Hitesh Patel, two
          judges, which did not discuss it); Reshma Kumari tied its 15 to a schedule since removed.
  - id: fixed_amounts
    section: formula
    step: Loss of estate, funeral and consortium amounts
    kinds: [death]
    type: conflict
    now: >-
      ₹15,000, ₹15,000 and ₹40,000, raised 10% (compounded) for each full three years from 31 Oct 2017 completed by
      the accident date, in the headline and the low figure: none before 31 Oct 2020, and the base amounts for
      accidents before 2017. The high figure counts the steps up to the date of decision (three from 31 Oct 2026). A
      caution gives the decision-date amounts while the point is before a larger bench.
    decided: >-
      As now. Check the larger bench's status before each step date; the steps stay cumulative and are never frozen
      at a fixed number (A-12, B-3).
    authorities:
      - { source: pranay_sethi_2017, para: "61(viii)" }
      - { source: satinder_kaur_2020, para: "8(e)(c)" }
      - { source: preetha_krishnan_2025, para: "19" }
      - { source: hasina_yasmin_2025 }
      - { source: shishu_pal_2026 }
    review:
      - { id: A-12, status: conditional, done: true }
      - { id: B-3, status: conditional, done: true }
    points: [conventional_escalation_steps]
    flagged:
      - review: A-12
        point: >-
          Whether the 10% steps run to the accident date or to the date of decision is before a larger bench
          (Hasina Yasmin, 17 Dec 2025); no decision found as of 24 Oct 2026.
    changes:
      - date: 2026-10-24
        what: The headline counts the steps completed by the accident date, in place of a fixed two steps (A-12).
  - id: consortium_claimants
    section: formula
    step: Who receives consortium
    kinds: [death]
    type: conflict
    now: ₹40,000 plus the same increases for each claiming spouse, child and parent, whatever their age or marriage.
    decided: >-
      Consortium for the categories the judgments establish: the spouse, minor children, and the parents of a minor
      or unmarried child. Not a blanket rule for every claimant; a short note decides the rest (B-2).
    authorities:
      - { source: magma_2018, para: "8.7" }
      - { source: satinder_kaur_2020, para: "8(e)(b), 9.7" }
      - { source: somwati_2020, para: "38-40" }
      - { source: sameem_begum_2026 }
    review:
      - { id: B-2, status: conditional }
    flagged:
      - review: B-2
        point: >-
          Adult children who earned or married, and the parents of a married adult: no judgment read decides them
          (Sameem Begum's adult children were dependants).
  # ---------------------------------------------------------------- injury
  - id: functional_disability
    section: injury
    step: Lost earning ability
    kinds: [injury]
    type: fact
    now: >-
      A doctor's functional % if given. Otherwise a whole-body certificate as it is, or a limb certificate (or one
      whose basis is unknown) × 0.5 in the low figure and × 0.53 in the headline, factors taken from Delhi awards.
      The high figure uses the full %, or 100% if the person cannot work at all.
    decided: >-
      The limb factors are not a legal rule and are held. Ask the occupation, the impairment, whether the earlier
      work or other suitable work is still possible, and use medical or vocational evidence. Factors may appear only
      in a labelled illustration (A-13).
    authorities:
      - { source: raj_kumar_2011, para: "7-10 (SCC 9-13)" }
      - { source: m_paramesh_2026 }
      - { source: priyanka_das_2026, para: "19" }
      - { source: delhi_awards_backtest_2026 }
    review:
      - { id: A-13, status: hold }
    points: [functional_pct]
  - id: injury_bands
    section: injury
    step: Pain and amenities, travel and diet, marriage prospects
    kinds: [injury]
    type: practice
    now: >-
      Bands from Delhi awards 2024-26: the lower quarter in the low figure, the middle in the headline, the upper
      quarter or a higher Supreme Court amount in the high figure; marked experimental. Travel and diet, pain (even
      without a certificate) and an attendant band when no days are given are added to every injury estimate.
    decided: >-
      Correct the source awards (amenities left out of Hitesh Patel and Baiju) and present the bands as estimates of
      tribunal practice, never as amounts the law requires (A-14). Ask about care, hospital stay, travel and diet
      before adding them; pain stays without a certificate (A-23).
    authorities:
      - { source: raj_kumar_2011, para: "5, 10" }
      - { source: kajal_2020, para: "27-29" }
      - { source: hitesh_patel_2025, para: "13" }
      - { source: baiju_2025 }
      - { source: delhi_awards_backtest_2026 }
    review:
      - { id: A-14, status: conditional }
      - { id: A-23, status: conditional }
    points: [non_pecuniary_band]
  - id: attendant
    section: injury
    step: Attendant
    kinds: [injury]
    type: fact
    now: >-
      For life: minimum wage × 12 × multiplier × number of carers (1 or 2), the unskilled wage in the low figure and
      the headline, semi-skilled in the high figure. During treatment: days × the unskilled monthly wage ÷ 26, or a
      band if days are not given.
    decided: >-
      Care needs first; the semi-skilled or skilled wage as the care requires; unpaid family care counted;
      temporary and lifelong care kept apart; ÷ 26 only where the wage structure supports it (A-15).
    authorities:
      - { source: kajal_2020, para: "21, 22, 25" }
      - { source: hansraj_2026, para: "9-10" }
    review:
      - { id: A-15, status: conditional }
    points: [attendant_rate]
  - id: child_treatment_earnings
    section: injury
    step: Earnings lost during treatment by a child
    kinds: [injury]
    type: fixed
    now: >-
      None for an injured child (or a student under 18 valued as a child); treatment, care and future loss stay.
    authorities:
      - { source: raj_kumar_2011, para: "5" }
    review:
      - { id: A-31, status: approve, done: true }
    changes:
      - date: 2026-10-24
        what: A child who did not earn no longer gets the skilled wage × the months of treatment (A-31).
  # ---------------------------------------------------------------- deductions
  - id: medical_bills
    section: deductions
    step: Medical bills
    kinds: [death, injury]
    type: fixed
    now: Bills less what the cashless treatment scheme paid (s.164B(5)); future medical costs only if entered.
    authorities:
      - { source: mv_act_1988, para: "s.164B(5)" }
      - { source: raj_kumar_2011, para: "5" }
  - id: fault
    section: deductions
    step: The person's own share of fault
    kinds: [death, injury]
    type: fact
    now: >-
      Only a percentage entered for the person's own fault cuts the total, whatever their role; another driver's
      fault is never imputed. The website never asks for one; for the driver of a vehicle involved it shows what 25%
      and 50% would cost, labelled as illustrations outside the standard amount.
    authorities:
      - { source: khenyei_2015, para: "4, 13, 14, 18" }
      - { source: satinder_kaur_2020, para: "9.8" }
    review:
      - { id: A-24, status: approve, done: true }
      - { id: B-9, status: approve, done: true }
      - { id: C-5, status: approve, done: true }
    changes:
      - date: 2026-10-24
        what: >-
          The 25% and 50% examples are labelled as illustrations (C-5); the written method no longer says fault
          cannot apply to pedestrians or passengers (B-9).
  - id: deduction_order
    section: deductions
    step: Order of deductions when fault, cashless payments and ex-gratia meet
    kinds: [death, injury]
    type: withheld
    now: >-
      Cashless payments come off the medical bills. Where an established fault share and a cashless payment meet,
      the medical expenses are left out and a caution gives the amount under each order of deduction; the fault
      cut applies to the rest of the total. Ex-gratia comes off after, capped at the income head as it was before
      the cut. In rare cases this puts the low figure above the headline.
    decided: >-
      Record bills, the scheme-paid part and the rest separately and prevent double payment, but no automatic
      combined cashless and fault adjustment until a reasoned statutory opinion (A-25). Cut for established fault
      first, then cap any permitted adjustment at the income head, and flag cases where the order changes the
      result; needs specific legal approval (A-29).
    authorities:
      - { source: mv_act_1988, para: "s.164B(5)" }
      - { source: sarla_devi_2026, para: "19" }
    review:
      - { id: A-25, status: hold, done: true }
      - { id: A-29, status: conditional }
    changes:
      - date: 2026-10-25
        what: >-
          With an established fault share and a cashless payment together, the calculator no longer picks an order
          of deduction: the medical expenses are left out and both amounts are given (A-25).
  - id: money_received
    section: deductions
    step: Money already received
    kinds: [death, injury]
    type: withheld
    now: >-
      Ex-gratia equal to pay comes off loss of dependency after a death (Sarla Devi's situation); after an injury it
      is recorded and not deducted. An earlier no-fault award (s.164) and interim relief are recorded, not deducted;
      the result says what a set-off would take away. A hit-and-run payment, refundable under s.163, comes off the
      total. There is no input for mediclaim, life insurance or provident fund, so none is deducted.
    decided: >-
      Record payments as facts and deduct only where the law is clear for that benefit. Ex-gratia only in Sarla
      Devi's situation, salary-equivalent assistance after a death, and a dependant who does not receive it keeps
      their share (A-26, B-10). No automatic s.164 set-off (A-28). No interim-relief set-off until the scheme's text
      is read (B-12). Separate categories for life insurance, personal mediclaim, employer reimbursement, cashless
      treatment and ex-gratia (B-11).
    authorities:
