        what: "One line on every result: 'Method not yet signed off by a lawyer' (B-14)."
      - date: 2026-10-24
        what: This register and the authority register published (B-13).
  # ---------------------------------------------------------------- data
  - id: income_tax
    section: data
    step: Income-tax tables
    kinds: [death, injury]
    type: fixed
    now: >-
      Tables for FY 2012-13 to FY 2026-27, each year with its own slabs, rebate and cess (3% until FY 2017-18, then
      4%), checked against official sources: the Finance Bill memoranda for FY 2012-13 to 2017-18 and FY 2019-20.
      For a year with no table, no other year's table is used: the estimate is withheld unless the tax actually
      paid is entered.
    decided: >-
      The accident year's own rules (A-27): load FY 2012-13 to 2017-18 and confirm FY 2019-20, with cess and rebate
      per year and a second person's check (D-4). Until then, rely on proved tax or withhold the estimate.
    review:
      - { id: A-27, status: approve, done: true }
      - { id: D-4, status: conditional }
    changes:
      - date: 2026-10-25
        what: >-
          Tables added for FY 2012-13 to 2017-18 and FY 2019-20 confirmed; a year without a table no longer
          borrows the latest one (A-27). A second person's check of the tables is still to come (D-4).
  - id: wages_other_states
    section: data
    step: Minimum wages outside Delhi
    kinds: [death, injury]
    type: fact
    now: >-
      Only Delhi and the Central construction schedule are loaded. Elsewhere, people without proof of income,
      homemakers, students, children and retired people without a pension get no estimate unless the Central
      fallback is chosen.
    decided: >-
      Add states one at a time from official notifications, each with its effective date, category, grade, zone and
      source; periods without one stay unavailable (D-1).
    review:
      - { id: D-1, status: conditional }
  - id: delhi_wages
    section: data
    step: Delhi minimum wages
    kinds: [death, injury]
    type: conflict
    now: >-
      Rates from 1 Oct 2011, except 1 Apr 2012 to 31 Mar 2013, where cases without proof of income get no estimate.
      From 3 Mar 2017 to 31 Oct 2018 the official series is used with a caution. The latest order is of 1 Apr 2025;
      an order dated 13 Oct 2025 was declared fake by the Labour Department.
    decided: >-
      No interpolation: obtain the missing orders from the Labour Department or by RTI (D-2). Keep the official
      series for 2017-18 with a legal qualification, after a labour-law review (D-3). The last authenticated rate
      until a later official order is verified, and no compliance-site figures (D-6).
