id: settings
verified: false
description: >-
  Fixed numbers the calculator uses that are product choices, not rules of law. They are kept here so that
  the reviewers can see and change them in one place.
range_bar_max_ratio:
  death: 1.75
  injury: 2.5
  note: The range bar is shown only when highest / lowest is at or below this; otherwise scenario cards.
wide_range_notice_ratio:
  value: 0.8
  note: The page says the low end is far below the headline when conservative < this x standard.
negligence_cards_pct:
  values: [25, 50]
  note: '"What if" cards shown when the person drove an involved vehicle and no negligence % is entered.'
wage_freshness_months:
  value: 7
  note: >-
    States revise minimum wages about every six months. A wage older than this at the accident date, with no
    recorded check of the official source since, raises a caution; the weekly staleness check uses the same window.
offer_defaults:
  interest_pct: 7.5
  discount_pct: 7
  lawyer_fee_pct: 0
  note: >-
    Offer check: simple interest a tribunal adds, the rate used to compare money now and later, and the lawyer's
    fee (an advocate may not take a share of the award). Years come from statutory.yaml. The check shows the offer,
    the estimate and the difference, never a verdict on the offer (legal review C-1).
